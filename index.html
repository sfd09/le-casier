           (state.suggestion === cle) + '">' + esc(liste[i].t) + "</button>";
    }
    return h + "</div>";
  }

  function majSuggestions() {
    var zone = document.getElementById("d-suggest");
    var sel = document.getElementById("d-cat");
    if (zone && sel) zone.innerHTML = blocSuggestions(sel.value);
  }

  function appliquerSuggestion(cle) {
    var bout = String(cle).split("|");
    var s = (SUGGESTIONS[bout[0]] || [])[+bout[1]];
    if (!s) return;
    var titre  = document.getElementById("d-titre");
    var auteur = document.getElementById("d-auteur");
    // L'élève a cliqué délibérément : on remplace ce qu'il avait mis,
    // quitte à ce qu'il retouche ensuite.
    if (titre)  titre.value  = s.t;
    if (auteur) auteur.value = s.a || "";
    state.suggestion = cle;
    retenirBrouillon();
    majPublier();
    majSuggestions();
  }

  function prixSaisiValide() {
    var champ = document.getElementById("d-prix");
    if (!champ) return true;
    // On s'en remet aux contraintes portées par le champ (required, min,
    // max, step) plutôt que de les réécrire ici : une règle recopiée
    // finit par diverger de celle que le navigateur applique vraiment,
    // et le bouton se rallumerait sur une valeur que l'envoi refuse.
    return champ.checkValidity();
  }

  function majPublier() {
    var b = document.getElementById("d-publier");
    if (b) b.disabled = !prixSaisiValide();
  }

  function onDepot(ev) {
    ev.preventDefault();
    var titre = document.getElementById("d-titre").value.trim();
    if (!titre) return;

    var prix = 0;
    if (state.depotMode === "vente") {
      prix = parseFloat(document.getElementById("d-prix").value);
      if (!(prix > 0)) { toast("Indiquez un prix."); return; }
      if (prix > PLAFOND_PRIX) {
        toast("Prix plafonné à " + PLAFOND_PRIX + " €. Au-delà, ce n'est plus l'esprit du service.");
        return;
      }
    }

    var champs = {
      titre: titre,
      auteur: document.getElementById("d-auteur").value.trim(),
      isbn: document.getElementById("d-isbn").value.replace(/[^0-9Xx]/g, ""),
      cat: document.getElementById("d-cat").value,
      matiere: document.getElementById("d-mat").value,
      niveau: document.getElementById("d-niv").value,
      etat: document.getElementById("d-etat").value,
      note: document.getElementById("d-note").value.trim(),
      mode: state.depotMode,
      prix: prix
    };

    // La photo part en premier : si l'envoi échoue, aucune annonce
    // orpheline n'est créée.
    if (!state.photo) {
      // Le bouton affiche « Changer la photo » alors que rien n'est
      // prêt : mieux vaut prévenir que publier une annonce muette.
      if (document.querySelector('[data-photo="retirer"]')) {
        toast("La photo a été perdue. Reprenez-la avant de publier.");
        return;
      }
      deposer(champs);
      return;
    }

    toast("Envoi de la photo…");
    televerser(state.photo).then(function (chemins) {
      champs.photo = chemins.photo;
      champs.photoMin = chemins.photo_min;
      deposer(champs);
    }).catch(function () {
      toast("La photo n'a pas pu être envoyée. Réessayez, ou publiez sans photo.");
    });
  }

  /* ---------------- scan de l'ISBN ---------------- */

  // Un livre porte SOUVENT DEUX codes-barres : l'EAN-13 qui encode
  // l'ISBN, et un petit code additionnel à 5 chiffres pour le prix.
  // Il faut donc examiner tous les codes détectés et retenir celui qui
  // est un ISBN, au lieu de prendre le premier venu.

  function cleEan13(c) {
    var somme = 0;
    for (var i = 0; i < 12; i++) somme += (+c[i]) * (i % 2 ? 3 : 1);
    return (10 - (somme % 10)) % 10 === +c[12];
  }

  function cleEan8(c) {
    var somme = 0;
    for (var i = 0; i < 7; i++) somme += (+c[i]) * (i % 2 ? 1 : 3);
    return (10 - (somme % 10)) % 10 === +c[7];
  }

  // Un code-barres d'article n'est pas un ISBN : pas de préfixe 978, pas
  // de signification, seulement une clé de contrôle. On accepte l'EAN-13,
  // l'EAN-8 des petits articles, et l'UPC-A américain à 12 chiffres qu'on
  // ramène à 13 en lui rendant le zéro que la norme sous-entend.
  function normaliserCode(brut) {
    var c = String(brut || "").replace(/[^0-9]/g, "");
    if (c.length === 12) c = "0" + c;
    if (c.length === 13 && cleEan13(c)) return c;
    if (c.length === 8  && cleEan8(c))  return c;
    return null;
  }

  function estIsbn(code) { return /^97[89]/.test(String(code || "")); }

  function cleIsbn10(c) {
    var somme = 0;
    for (var i = 0; i < 9; i++) somme += (+c[i]) * (10 - i);
    var d = c[9] === "X" ? 10 : +c[9];
    return (somme + d) % 11 === 0;
  }

  // Les livres d'avant 2007 portent un ISBN-10 : on le convertit plutôt
  // que de le rejeter, sinon la moitié d'un CDI serait illisible.
  function isbn10Vers13(c) {
    var base = "978" + c.slice(0, 9);
    var somme = 0;
    for (var i = 0; i < 12; i++) somme += (+base[i]) * (i % 2 ? 3 : 1);
    return base + ((10 - (somme % 10)) % 10);
  }

  function normaliserIsbn(brut) {
    var c = String(brut || "").toUpperCase().replace(/[^0-9X]/g, "");
    if (c.length === 13 && /^97[89]/.test(c) && cleEan13(c)) return c;
    if (c.length === 10 && cleIsbn10(c)) return isbn10Vers13(c);
    return null;
  }

  function isbnValide(code) { return !!normaliserIsbn(code); }

  // Beaucoup de livres portent, à côté du code-barres, un QR code menant
  // à la fiche de l'éditeur — et cette adresse contient souvent l'EAN.
  // Un QR se lit bien plus facilement qu'un code-barres : il est
  // bidimensionnel et corrige ses propres erreurs, là où un EAN-13 exige
  // une image nette. On accepte donc les deux, et on cherche un ISBN
  // partout dans le texte décodé.
  function isbnDansTexte(t) {
    var brut = String(t || "");
    var compact = brut.replace(/[^0-9Xx]/g, "");
    var direct = normaliserIsbn(brut);
    if (direct) return direct;

    var m = compact.match(/97[89][0-9]{10}/g) || [];
    for (var i = 0; i < m.length; i++) {
      var n = normaliserIsbn(m[i]);
      if (n) return n;
    }
    // ISBN écrit avec tirets dans une adresse : 978-2-340-04238-4
    var tirets = brut.match(/97[89][-\s0-9]{11,17}/g) || [];
    for (var j = 0; j < tirets.length; j++) {
      var t2 = normaliserIsbn(tirets[j]);
      if (t2) return t2;
    }
    return null;
  }

  // Retient le premier code de la liste dont on puisse tirer un ISBN.
  function extraireIsbn(codes) {
    for (var i = 0; i < codes.length; i++) {
      var n = isbnDansTexte(codes[i]);
      if (n) return n;
    }
    return null;
  }

  // Pour un article quelconque, on n'accepte qu'un code-barres pur.
  // Fouiller le texte d'un QR à la recherche de treize chiffres, comme on
  // le fait pour un ISBN, produirait trop de faux positifs : une adresse
  // web contient volontiers un identifiant de cette longueur.
  function extraireCode(codes) {
    var isbn = extraireIsbn(codes);
    if (isbn) return isbn;
    for (var i = 0; i < codes.length; i++) {
      var n = normaliserCode(codes[i]);
      if (n) return n;
    }
    return null;
  }

  var scan = { flux: null, piste: null, lecteur: null, boucle: null,
               actif: false, minuteur: null, toile: null, lampe: false,
               journal: [], images: 0, vus: [] };

  // Impossible de reproduire les échecs de lecture à distance : le scanner
  // consigne donc ce qu'il fait, et l'élève peut nous transmettre le
  // relevé. Sans cela on corrige à l'aveugle.
  function noter(quoi) {
    scan.journal.push(quoi);
    if (scan.journal.length > 40) scan.journal.shift();
  }

  function releve() {
    var l = [];
    l.push("Appareil : " + navigator.userAgent);
    l.push("Décodeur natif : " + (("BarcodeDetector" in window) ? "oui" : "non (bibliothèque utilisée)"));
    l.push("Bibliothèque chargée : " + (window.ZXing ? "oui" : "non"));
    var v = document.getElementById("scanner-video");
    l.push("Vidéo : " + (v ? (v.videoWidth + "x" + v.videoHeight) : "absente"));
    if (scan.piste && scan.piste.getSettings) {
      var st = scan.piste.getSettings();
      l.push("Caméra : " + st.width + "x" + st.height + " · " + (st.facingMode || "?"));
    }
    l.push("Images analysées : " + scan.images);
    l.push("Codes vus : " + (scan.vus.length ? scan.vus.join(" | ") : "AUCUN"));
    l.push("Journal : " + scan.journal.join(" > "));
    return l.join("\n");
  }

  function texteScan(msg, detail) {
    var el = document.getElementById("scanner-texte");
    if (el) el.innerHTML = esc(msg) + (detail ? "<small>" + esc(detail) + "</small>" : "");
  }

  function fermerScanner() {
    scan.actif = false;
    if (scan.minuteur) { clearTimeout(scan.minuteur); scan.minuteur = null; }
    if (scan.boucle) { cancelAnimationFrame(scan.boucle); scan.boucle = null; }
    if (scan.lecteur) { try { scan.lecteur.reset(); } catch (e) {} scan.lecteur = null; }
    if (scan.piste && scan.lampe) {
      try { scan.piste.applyConstraints({ advanced: [{ torch: false }] }).catch(function () {}); } catch (e) {}
    }
    scan.lampe = false; scan.piste = null;
    var bl = document.getElementById("btn-lampe");
    if (bl) { bl.hidden = true; bl.textContent = "Lampe"; }
    if (scan.flux) { scan.flux.getTracks().forEach(function (t) { t.stop(); }); scan.flux = null; }
    var v = document.getElementById("scanner-video");
    if (v) v.srcObject = null;
    document.getElementById("scanner").hidden = true;
    document.body.style.overflow = "";
  }

  // Reçoit TOUS les codes vus sur l'image. Un code qui n'est pas un ISBN
  // — le code prix, un code produit — est ignoré en silence : afficher
  // une erreur à chaque image ferait clignoter un message d'échec alors
  // que le scan fonctionne.
  function codesLus(codes) {
    if (!scan.actif) return;
    for (var k = 0; k < codes.length; k++) {
      if (scan.vus.indexOf(codes[k]) === -1) scan.vus.push(codes[k]);
    }
    var code = extraireCode(codes);
    if (!code) return;   // codes non exploitables : consignés dans le relevé
    fermerScanner();
    var champ = document.getElementById("d-isbn");
    if (champ) champ.value = code;
    state.dernierIsbn = code;
    remplirDepuisCode(code);
  }

  // Chrome et Android savent lire un code-barres nativement. Safari non :
  // on ne charge la bibliothèque (330 ko) que dans ce cas, et seulement
  // au moment où l'élève appuie sur « Scanner ».
  function chargerZXing() {
    if (window.ZXing) return Promise.resolve();
    return new Promise(function (res, rej) {
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
      sc.onload = res;
      sc.onerror = function () { rej(new Error("bibliothèque indisponible")); };
      document.head.appendChild(sc);
    });
  }

  function ouvrirScanner() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("Cet appareil ne permet pas le scan. Saisissez l'ISBN à la main.");
      return;
    }
    var boite = document.getElementById("scanner");
    var video = document.getElementById("scanner-video");
    boite.hidden = false;
    document.body.style.overflow = "hidden";
    scan.actif = true;
    texteScan("Ouverture de la caméra…");

    scan.journal = []; scan.images = 0; scan.vus = [];
    var natif = "BarcodeDetector" in window;
    noter(natif ? "natif" : "bibliotheque");

    var bp = document.querySelector('[data-scan="photo"]');
    if (bp && !natif) {
      // Safari ne donne aux pages qu'un flux vidéo bridé : l'appareil
      // photo natif reste le chemin fiable, on le propose en premier.
      bp.className = "btn primary";
      bp.textContent = "Photographier le code";
      bp.parentNode.insertBefore(bp, bp.parentNode.firstChild);
    }
    var demarrage = natif ? scanNatif(video) : scanZXing(video);

    demarrage.catch(function (e) {
      noter("ERREUR " + (e && (e.name || e.message)));
      var m = String(e && e.name);
      if (m === "NotAllowedError")     texteScan("Accès à la caméra refusé.", "Autorisez la caméra dans les réglages du navigateur, puis réessayez.");
      else if (m === "NotFoundError")  texteScan("Aucune caméra trouvée.", "Saisissez l'ISBN à la main.");
      else                             texteScan("Le scan en direct n'a pas pu démarrer.", "Utilisez « Photographier le code », ou saisissez l'ISBN à la main.");
    });
  }

  // Sur iPhone, le flux vidéo de Safari est souvent peu net et sa mise au
  // point mal maîtrisable. L'appareil photo natif, lui, produit une image
  // pleine résolution et parfaitement nette : on décode celle-là.
  // ---- Décodage d'une photo fixe ----
  // Contrairement à un flux vidéo, une photo laisse le temps d'insister :
  // on essaie plusieurs cadrages, plusieurs contrastes, plusieurs
  // orientations, avec deux moteurs différents. C'est ce qui rapproche le
  // résultat de celui d'une application native.

  function chargerQuagga() {
    if (window.Quagga) return Promise.resolve();
    return new Promise(function (res, rej) {
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js";
      sc.onload = res;
      sc.onerror = function () { rej(new Error("quagga indisponible")); };
      document.head.appendChild(sc);
    });
  }

  // Réduit l'image : un cliché de 12 Mpx est trop grand pour les
  // décodeurs, qui travaillent mieux entre 1000 et 1600 points.
  function variante(img, largeurMax, recadre, rotation, contraste) {
    var l = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var sx = 0, sy = 0, sl = l, sh = h;
    if (recadre < 1) {
      sl = l * recadre; sh = h * recadre;
      sx = (l - sl) / 2; sy = (h - sh) / 2;
    }
    var r = Math.min(1, largeurMax / Math.max(sl, sh));
    var dl = Math.round(sl * r), dh = Math.round(sh * r);

    var c = document.createElement("canvas");
    var g = c.getContext("2d", { willReadFrequently: true });
    if (rotation) { c.width = dh; c.height = dl; g.translate(dh / 2, dl / 2); g.rotate(Math.PI / 2); g.translate(-dl / 2, -dh / 2); }
    else { c.width = dl; c.height = dh; }
    g.drawImage(img, sx, sy, sl, sh, 0, 0, dl, dh);

    if (contraste) {
      var d = g.getImageData(0, 0, c.width, c.height), p = d.data;
      for (var i = 0; i < p.length; i += 4) {
        var gris = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114);
        var v = gris > 128 ? Math.min(255, (gris - 128) * 2.2 + 128)
                           : Math.max(0, (gris - 128) * 2.2 + 128);
        p[i] = p[i + 1] = p[i + 2] = v;
      }
      g.putImageData(d, 0, 0);
    }
    return c;
  }

  function essayerNatif(c) {
    if (!("BarcodeDetector" in window)) return Promise.resolve([]);
    return new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "qr_code"] })
      .detect(c)
      .then(function (r) { return (r || []).map(function (x) { return x.rawValue; }); })
      .catch(function () { return []; });
  }

  function essayerZXing(c) {
    if (!window.ZXing) return Promise.resolve([]);
    try {
      var Z = window.ZXing;
      // HTMLCanvasElementLuminanceSource convertit correctement les pixels.
      // RGBLuminanceSource, nourri d'octets RGBA, les prenait pour du gris
      // et ne lisait plus rien : c'était la panne sur iPhone.
      var src = new Z.HTMLCanvasElementLuminanceSource(c);
      var bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src));
      var h = new Map();
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS,
            [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.QR_CODE]);
      h.set(Z.DecodeHintType.TRY_HARDER, true);
      var lect = new Z.MultiFormatReader();
      lect.setHints(h);
      return Promise.resolve([lect.decode(bmp).getText()]);
    } catch (e) { return Promise.resolve([]); }
  }

  function essayerQuagga(c) {
    if (!window.Quagga) return Promise.resolve([]);
    return new Promise(function (res) {
      try {
        window.Quagga.decodeSingle({
          src: c.toDataURL("image/png"),
          numOfWorkers: 0,
          locate: true,
          inputStream: { size: 800 },   // taille de travail fixe : Quagga échoue au-delà
          decoder: { readers: ["ean_reader", "ean_8_reader"] }
        }, function (r) { res(r && r.codeResult ? [r.codeResult.code] : []); });
      } catch (e) { res([]); }
    });
  }

  function decoderImage(fichier) {
    texteScan("Lecture de la photo…", "Plusieurs traitements sont essayés, cela prend quelques secondes.");
    noter("photo " + Math.round(fichier.size / 1024) + "ko");

    var url = URL.createObjectURL(fichier);
    var img = new Image();

    img.onload = function () {
      URL.revokeObjectURL(url);
      noter("image " + img.naturalWidth + "x" + img.naturalHeight);

      // Du plus probable au plus coûteux.
      var variantes = [
        [1600, 1,    0, false], [1600, 0.55, 0, false],
        [1200, 1,    0, true ], [1200, 0.55, 0, true ],
        [1600, 1,    1, false], [1600, 0.55, 1, true ],
        [900,  1,    0, false]
      ];

      Promise.all([chargerZXing().catch(function () {}), chargerQuagga().catch(function () {})])
        .then(function () {
          var i = 0;
          function suite() {
            if (!variantes[i]) {
              texteScan("Code non reconnu sur cette photo.",
                "Cadrez le code-barres seul, bien à plat, sans reflet — ou saisissez les 13 chiffres à la main.");
              noter("echec apres " + i + " essais");
              return;
            }
            var v = variantes[i], c = variante(img, v[0], v[1], v[2], v[3]);
            texteScan("Lecture… essai " + (i + 1) + " sur " + variantes.length);
            essayerNatif(c)
              .then(function (r) { return r.length ? r : essayerZXing(c); })
              .then(function (r) { return r.length ? r : essayerQuagga(c); })
              .then(function (codes) {
                for (var k = 0; k < codes.length; k++) {
                  if (scan.vus.indexOf(codes[k]) === -1) scan.vus.push(codes[k]);
                }
                var code = extraireCode(codes);
                if (code) { noter("trouve essai " + (i + 1)); codesLus([code]); return; }
                i++; setTimeout(suite, 0);
              });
          }
          suite();
        });
    };

    img.onerror = function () {
      URL.revokeObjectURL(url);
      texteScan("Image illisible.", "Réessayez, ou saisissez l'ISBN à la main.");
    };
    img.src = url;
  }

  function afficherReleve() {
    var boite = document.getElementById("releve");
    var texte = releve();
    boite.textContent = texte;
    boite.hidden = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte)
        .then(function () { toast("Relevé copié — collez-le dans la conversation."); })
        .catch(function () { toast("Relevé affiché : recopiez-le ou faites une capture."); });
    } else {
      toast("Relevé affiché : faites une capture d'écran.");
    }
  }

  function viserEtPatienter() {
    texteScan("Visez le code-barres ou le QR code.",
      ("BarcodeDetector" in window)
        ? "Au dos du livre. Le QR code, quand il y en a un, se lit plus facilement."
        : "Sur iPhone, « Photographier le code » donne de bien meilleurs résultats que la lecture en direct.");
    if (scan.minuteur) clearTimeout(scan.minuteur);
    // Au bout de dix secondes sans lecture, on aide au lieu de laisser
    // l'élève insister dans le vide.
    scan.minuteur = setTimeout(function () {
      if (scan.actif) texteScan("Toujours rien ?",
        "Inclinez le livre pour chasser le reflet, tenez-le à 15-20 cm bien à plat. Sinon : « Photographier le code », ou saisissez l'ISBN à la main. Le bouton Diagnostic indique ce que voit l'application.");
    }, 10000);
  }

  // La résolution par défaut d'une caméra web est souvent 640x480 :
  // beaucoup trop faible pour les barres serrées d'un EAN-13. On demande
  // du 1920 et une mise au point continue, sans quoi les couvertures
  // pelliculées restent floues.
  function ouvrirCamera(video) {
    return navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (flux) {
      scan.flux = flux;
      video.srcObject = flux;
      var piste = flux.getVideoTracks()[0];
      scan.piste = piste;

      // Réglages avancés : ils échouent silencieusement là où ils
      // n'existent pas, d'où le catch vide.
      try {
        piste.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function () {});
      } catch (e) {}

      var cap = piste.getCapabilities ? piste.getCapabilities() : {};
      if (cap && cap.torch) {
        var b = document.getElementById("btn-lampe");
        if (b) b.hidden = false;
      }
      noter("camera ouverte");
      return video.play().then(function () { noter("video en lecture"); });
    });
  }

  function basculerLampe() {
    if (!scan.piste) return;
    scan.lampe = !scan.lampe;
    scan.piste.applyConstraints({ advanced: [{ torch: scan.lampe }] })
      .then(function () {
        var b = document.getElementById("btn-lampe");
        if (b) b.textContent = scan.lampe ? "Éteindre" : "Lampe";
        if (scan.lampe) texteScan("Lampe allumée.",
          "Sur une couverture brillante, elle crée parfois un reflet : éteignez-la si la lecture ne vient pas.");
      })
      .catch(function () { toast("Cet appareil ne permet pas d'allumer la lampe."); });
  }

  // On ne décode que le contenu du cadre, agrandi : le décodeur reçoit
  // ainsi plus de pixels utiles et moins de décor.
  function imageDuViseur(video) {
    var vl = video.videoWidth || video.width, vh = video.videoHeight || video.height;
    if (!vl || !vh) return null;
    var lRel = 0.86, hRel = 0.34;              // proportions du cadre
    var sl = vl * lRel, sh = vh * hRel;
    var sx = (vl - sl) / 2, sy = (vh - sh) / 2;
    var c = scan.toile || (scan.toile = document.createElement("canvas"));
    c.width = Math.round(sl); c.height = Math.round(sh);
    c.getContext("2d", { willReadFrequently: true })
     .drawImage(video, sx, sy, sl, sh, 0, 0, c.width, c.height);
    return c;
  }

  function scanNatif(video) {
    // ean_13 encode l'ISBN ; ean_8 couvre quelques éditions anciennes.
    var detecteur = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "qr_code"] });
    return ouvrirCamera(video)
      .then(function () {
        viserEtPatienter();
        function tour() {
          if (!scan.actif) return;
          scan.images++;
          detecteur.detect(imageDuViseur(video) || video)
            .then(function (codes) {
              if (codes && codes.length) {
                codesLus(codes.map(function (c) { return c.rawValue; }));
              }
            })
            .catch(function () {})
            .then(function () { if (scan.actif) scan.boucle = requestAnimationFrame(tour); });
        }
        scan.boucle = requestAnimationFrame(tour);
      });
  }

  function scanZXing(video) {
    // Même décodeur que pour les photos — celui qui a été vérifié —
    // appliqué image par image sur le seul contenu du cadre. Avant, le
    // direct passait par un autre point d'entrée de la bibliothèque et
    // analysait toute l'image : le code-barres n'y pesait qu'une fraction
    // des pixels, insuffisante à la résolution que Safari concède.
    return Promise.all([chargerZXing(), chargerQuagga().catch(function () {})])
      .then(function () { return ouvrirCamera(video); })
      .then(function () {
        viserEtPatienter();
        noter("boucle sur le cadre");
        var n = 0, occupe = false, dernier = 0;
        function tour(t) {
          if (!scan.actif) return;
          // ~8 images par seconde : suffisant, et laisse respirer le téléphone.
          if (occupe || (t - dernier) < 120) { scan.boucle = requestAnimationFrame(tour); return; }
          var c = imageDuViseur(video);
          if (!c) { scan.boucle = requestAnimationFrame(tour); return; }
          occupe = true; dernier = t; scan.images++; n++;
          essayerZXing(c)
            // Quagga est plus lent : une image sur quatre, si ZXing n'a rien lu.
            .then(function (r) { return (r.length || (n % 4)) ? r : essayerQuagga(c); })
            .then(function (codes) { if (codes.length) { noter("code lu"); codesLus(codes); } })
            .catch(function () {})
            .then(function () { occupe = false; if (scan.actif) scan.boucle = requestAnimationFrame(tour); });
        }
        scan.boucle = requestAnimationFrame(tour);
      });
  }

  /* ---------------- recherche du livre ---------------- */

  // La déduction procédait par ordre : la première règle qui accrochait
  // l'emportait. « Modèles mathématiques » dans les sujets d'un livre de
  // chimie le classait en mathématiques, et « Roman anglais » rangeait un
  // roman traduit parmi les langues. On pèse désormais, au lieu de courir.
  //
  // Une matière fausse est pire qu'une matière absente : elle fait
  // manquer les correspondances, et « le premier fait foi » la fige pour
  // tout le lycée. En cas de doute, on ne renseigne rien.

  var MOTS_MATIERE = [
    ["Mathématiques",  /math[eé]matiq|alg[eè]bre|g[eé]om[eé]trie|arithm[eé]tiq|probabilit|trigonom/i],
    ["Physique-Chimie",/physique|chimie|chimiqu|m[eé]caniq|thermodynam|[eé]lectroniqu|mol[eé]cul|atom/i],
    ["SVT",            /\bsvt\b|biolog|g[eé]olog|sciences de la vie|g[eé]n[eé]tiq|[eé]cosyst/i],
    ["Histoire-Géo",   /histoire|g[eé]ograph|g[eé]opolit/i],
    ["SES",            /\bses\b|[eé]conomi|sociolog|sciences sociales/i],
    ["Philosophie",    /philosoph/i],
    ["NSI",            /\bnsi\b|informatiq|algorithm|python|programmation/i],
    ["Langues",        /m[eé]thode de langue|grammaire (anglaise|espagnole|allemande)|vocabulaire (anglais|espagnol)|bilingue|dictionnaire/i],
    // « français » seul apparaît dans « traductions françaises » ou
    // « dictionnaires français » : trop courant pour désigner la matière.
    ["Français",       /roman|po[eé]sie|po[eè]me|th[eé][aâ]tre|litt[eé]rature fran|nouvelles|r[eé]cit/i]
  ];

  var MOTS_NIVEAU = [
    ["Terminale", /terminale|\bterm\b/i],
    ["Première",  /premi[eè]re|\b1re\b/i],
    ["Seconde",   /seconde|\b2de\b/i],
    ["Prépa",     /pr[eé]pa|classes pr[eé]paratoires|\bsup\b|\bspé\b/i]
  ];

  // Les sujets du catalogue valent mieux que le titre, et le premier
  // sujet mieux que les suivants : le SUDOC place le principal en tête.
  function peser(regles, sujets, titre) {
    var scores = {};
    function compter(texte, poids) {
      if (!texte) return;
      for (var i = 0; i < regles.length; i++) {
        if (regles[i][1].test(texte)) {
          scores[regles[i][0]] = (scores[regles[i][0]] || 0) + poids;
        }
      }
    }
    (sujets || []).forEach(function (s, i) { compter(s, i === 0 ? 4 : 2); });
    compter(titre, 1);

    var meilleur = "", score = 0, exaequo = false;
    for (var k in scores) {
      if (scores[k] > score) { meilleur = k; score = scores[k]; exaequo = false; }
      else if (scores[k] === score) { exaequo = true; }
    }
    // Un titre seul (poids 1) ne suffit pas, et une égalité non plus.
    return (score >= 2 && !exaequo) ? meilleur : "";
  }

  // Un manuel se reconnaît à ses sujets bien mieux qu'à son éditeur :
  // le SUDOC indexe « Manuels d'enseignement secondaire ».
  function devinerCategorie(sujets, texte) {
    var tout = (sujets || []).join(" ") + " " + (texte || "");
    if (/manuel|enseignement secondaire|annales|programmes scolaires|exercices corrig/i.test(tout)) return "manuel";
    if (/roman|po[eé]sie|th[eé][aâ]tre|litt[eé]rature|nouvelles|bande dessin/i.test(tout)) return "lecture";
    return "";
  }


  // 1. La mémoire du lycée. Interrogée en premier : c'est la seule source
  //    qui connaisse le parascolaire français, et la seule qui réponde
  //    instantanément.
  // Les fiches sont peu nombreuses (une par ISBN du lycée) : on les garde
  // en mémoire pour enrichir le catalogue sans un appel par annonce.
  function chargerFiches() {
    if (!state.sb) return Promise.resolve();
    return state.sb.from("fiches").select("*")
      .then(function (r) {
        var m = {};
        (r.data || []).forEach(function (f) { m[f.code] = f; });
        state.fiches = m;
      })
      .catch(function () { state.fiches = {}; });
  }

  // Complète une annonce avec ce que le lycée sait de son ISBN.
  function fichePour(o) {
    return (o && o.isbn && state.fiches[o.isbn]) || null;
  }

  function chercherFiche(code) {
    if (!state.sb) return Promise.resolve(null);
    return state.sb.from("fiches").select("*").eq("code", code).maybeSingle()
      .then(function (r) {
        if (r.error || !r.data) return null;
        var f = r.data;
        return {
          titre: f.titre, auteur: f.auteur || "",
          categorie: f.categorie || "", matiere: f.matiere || "", niveau: f.niveau || "",
          source: f.saisies > 1
            ? "renseigné par " + f.saisies + " élèves du lycée"
            : "renseigné par un élève du lycée"
        };
      })
      .catch(function () { return null; });
  }

  // 2. Le SUDOC, catalogue des bibliothèques universitaires françaises.
  //    C'est la source qui connaît l'édition parascolaire et de prépa —
  //    Ellipses, Vuibert, Dunod — que les catalogues internationaux
  //    ignorent. Deux appels : l'ISBN donne un numéro de notice, la
  //    notice donne la description.
  // Coupe sur un mot entier plutôt qu'au milieu : « Lionel Vid » n'aide
  // personne.
  function couper(t, n) {
    t = String(t || "").trim();
    if (t.length <= n) return t;
    var court = t.slice(0, n);
    var esp = court.lastIndexOf(" ");
    return (esp > n * 0.6 ? court.slice(0, esp) : court).replace(/[,;:\s]+$/, "") + "…";
  }

  // Le SUDOC écrit « Cédric Roux,... avec la collaboration de X,...Y ».
  // On garde le premier auteur et on jette l'appareil bibliographique.
  function nettoyerAuteur(t) {
    return String(t || "")
      .replace(/\s+/g, " ")
      .split(/\s*;\s*/)[0]
      .split(/\s*,?\s*avec (?:la collaboration|le concours|la participation)/i)[0]
      .replace(/^(par|sous la direction de|dir\.)\s+/i, "")
      .replace(/,\.\.\./g, "")
      .replace(/\.\.\./g, "")
      .replace(/[,;:.\s]+$/, "")
      .trim();
  }

  function chercherSudoc(isbn) {
    return fetch("https://www.sudoc.fr/services/isbn2ppn/" + isbn)
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (xml) {
        if (!xml) return null;
        var m = xml.match(/<ppn>([0-9Xx]+)<\/ppn>/);
        if (!m) return null;
        return fetch("https://www.sudoc.fr/" + m[1] + ".rdf")
          .then(function (r) { return r.ok ? r.text() : null; });
      })
      .then(function (rdf) {
        if (!rdf) return null;
        var doc = new DOMParser().parseFromString(rdf, "application/xml");
        function tous(tag) {
          var n = doc.getElementsByTagName(tag), v = [];
          for (var i = 0; i < n.length; i++) {
            var t = (n[i].textContent || "").trim();
            if (t) v.push(t);
          }
          return v;
        }
        function un(tag) { var v = tous(tag); return v.length ? v[0] : ""; }

        var brut = un("dc:title");
        if (!brut) return null;
        var titre = brut.split(" / ")[0].replace(/\s+/g, " ").replace(/\s+:/g, " :").trim();

        // foaf:name donne « Roux, Cédric (1981-....) » : plus fiable que
        // de découper le titre, mais il faut remettre le prénom devant.
        var noms = tous("foaf:name").map(function (n) {
          n = n.replace(/\s*\(\d{2,4}[-.\d]*\)\s*$/, "").trim();
          var p = n.split(/,\s*/);
          return p.length === 2 ? (p[1] + " " + p[0]).trim() : n;
        }).filter(Boolean);
        var auteur = noms.length ? noms.slice(0, 2).join(", ")
                                 : nettoyerAuteur(brut.split(" / ")[1] || "");

        // « Paris : Ellipses , DL 2020 » → éditeur et année
        var pub = un("dc:publisher"), editeur = "", annee = null;
        if (pub) {
          editeur = pub.split(":").pop().replace(/,?\s*(DL|impr\.|cop\.)?\s*\d{4}.*$/i, "")
                       .replace(/[,;\s]+$/, "").trim();
          var an = pub.match(/(19|20)\d{2}/);
          if (an) annee = parseInt(an[0], 10);
        }
        if (!annee) { var d2 = un("dc:date").match(/(19|20)\d{2}/); if (d2) annee = parseInt(d2[0], 10); }

        // « 1 vol. (506 p.) : ill. ... » → pagination
        var pages = null;
        var fmt = un("dc:format").match(/(\d{2,4})\s*p\b/);
        if (fmt) pages = parseInt(fmt[1], 10);

        return {
          titre: couper(titre, 90),
          auteur: couper(auteur, 60),
          editeur: couper(editeur, 40),
          annee: annee,
          pages: pages,
          resume: couper(un("dcterms:abstract"), 400),
          sujets: tous("dc:subject").slice(0, 4),
          source: "SUDOC"
        };
      })
      .catch(function () { return null; });
  }

  function chercherGoogle(isbn) {
    return fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.totalItems || !d.items) return null;
        var v = d.items[0].volumeInfo || {};
        if (!v.title) return null;
        var img = v.imageLinks || {};
        return {
          titre: couper(v.subtitle ? v.title + " — " + v.subtitle : v.title, 90),
          auteur: couper((v.authors || []).join(", "), 60),
          editeur: couper(v.publisher || "", 40),
          annee: v.publishedDate ? parseInt(String(v.publishedDate).slice(0, 4), 10) || null : null,
          pages: v.pageCount || null,
          resume: couper(v.description || "", 400),
          sujets: v.categories || [],
          couverture: (img.thumbnail || img.smallThumbnail || "").replace(/^http:/, "https:"),
          source: "Google Books"
        };
      })
      .catch(function () { return null; });
  }

  function chercherOpenLibrary(isbn) {
    return fetch("https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var v = d && d["ISBN:" + isbn];
        if (!v || !v.title) return null;
        var cov = v.cover || {};
        return {
          titre: couper(v.title, 90),
          auteur: couper((v.authors || []).map(function (a) { return a.name; }).join(", "), 60),
          editeur: couper((v.publishers || []).map(function (p) { return p.name; }).join(", "), 40),
          annee: v.publish_date ? parseInt(String(v.publish_date).match(/(19|20)\d{2}/) || 0, 10) || null : null,
          pages: v.number_of_pages || null,
          resume: "",
          sujets: (v.subjects || []).slice(0, 4).map(function (x) { return x.name || x; }),
          couverture: cov.medium || cov.large || "",
          source: "Open Library"
        };
      })
      .catch(function () { return null; });
  }

  // La BnF n'indexe les ISBN qu'à dix chiffres pour une partie de ses
  // notices : on essaie les deux formes.
  function isbn13Vers10(c) {
    var noyau = c.slice(3, 12), somme = 0;
    for (var i = 0; i < 9; i++) somme += (+noyau[i]) * (10 - i);
    var cle = (11 - (somme % 11)) % 11;
    return noyau + (cle === 10 ? "X" : String(cle));
  }

  function interrogerBnf(code) {
    var url = "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve" +
              "&query=" + encodeURIComponent('bib.isbn all "' + code + '"') +
              "&recordSchema=dublincore&maximumRecords=1";
    return fetch(url)
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (xml) {
        if (!xml) return null;
        var doc = new DOMParser().parseFromString(xml, "application/xml");
        var lire = function (tag) {
          var n = doc.getElementsByTagName("dc:" + tag)[0];
          return n && n.textContent ? n.textContent.trim() : "";
        };
        var titre = lire("title");
        if (!titre) return null;
        return {
          titre: titre.replace(/\s*\/\s*.*$/, "").slice(0, 90),
          auteur: lire("creator") || lire("publisher") || "",
          source: "BnF"
        };
      })
      .catch(function () { return null; });
  }

  function chercherBnf(isbn) {
    return interrogerBnf(isbn).then(function (r) {
      if (r) return r;
      return /^978/.test(isbn) ? interrogerBnf(isbn13Vers10(isbn)) : null;
    });
  }

  // Le scan reste utile même quand aucun catalogue ne connaît le livre :
  // l'ISBN est rempli sans faute de frappe, et l'élève complète le reste.
  // Un 978 ou 979 est un livre : les catalogues publics le connaissent.
  // Tout le reste n'existe que dans la mémoire du lycée, faute de base
  // publique et gratuite décrivant les objets ordinaires.
  function remplirDepuisCode(code) {
    if (estIsbn(code)) return remplirDepuisIsbn(code);
    return remplirDepuisArticle(code);
  }

  function remplirDepuisArticle(code) {
    toast("Code " + code + " — recherche…");
    state.ficheTrouvee = null;
    return chercherFiche(code).then(function (r) {
      var champ = function (id) { return document.getElementById(id); };
      if (!r) {
        toast("Article encore inconnu du casier. Décrivez-le : le prochain élève n'aura plus rien à saisir.");
        if (champ("d-titre")) champ("d-titre").focus();
        return;
      }
      if (champ("d-titre")  && !champ("d-titre").value)  champ("d-titre").value  = r.titre;
      if (champ("d-auteur") && !champ("d-auteur").value) champ("d-auteur").value = r.auteur;
      if (r.categorie && champ("d-cat")) champ("d-cat").value = r.categorie;
      if (r.matiere   && champ("d-mat")) champ("d-mat").value = r.matiere;
      if (r.niveau    && champ("d-niv")) champ("d-niv").value = r.niveau;
      state.ficheTrouvee = r;
      retenirBrouillon();
      toast(r.titre.slice(0, 38) + " — " + r.source);
    });
  }

  function remplirDepuisIsbn(isbn) {
    toast("ISBN " + isbn + " — recherche…");
    state.ficheTrouvee = null;
    // La mémoire du lycée d'abord : instantanée, et seule à connaître
    // les manuels scolaires français.
    chercherFiche(isbn)
      .then(function (r) { return r || chercherSudoc(isbn); })
      .then(function (r) { return r || chercherGoogle(isbn); })
      .then(function (r) { return r || chercherOpenLibrary(isbn); })
      .then(function (r) { return r || chercherBnf(isbn); })
      .then(function (r) {
        var champ = function (id) { return document.getElementById(id); };
        if (!r) {
          toast("Livre inconnu : saisissez le titre. Il servira aux autres élèves.");
          if (champ("d-titre")) champ("d-titre").focus();
          return;
        }
        if (champ("d-titre") && !champ("d-titre").value)  champ("d-titre").value = r.titre;
        if (champ("d-auteur") && !champ("d-auteur").value) champ("d-auteur").value = r.auteur;

        state.ficheTrouvee = r;
        var texte = r.titre + " " + r.auteur;
        var mat = r.matiere || peser(MOTS_MATIERE, r.sujets, texte);
        var niv = r.niveau  || peser(MOTS_NIVEAU, r.sujets, texte);
        if (mat && champ("d-mat")) champ("d-mat").value = mat;
        if (niv && champ("d-niv")) champ("d-niv").value = niv;
        var cat = r.categorie || devinerCategorie(r.sujets, texte);
        if (cat && champ("d-cat")) champ("d-cat").value = cat;
        retenirBrouillon();
        toast(r.titre.slice(0, 38) + " — " + r.source);
      });
  }


  /* ---------------- visionneuse ---------------- */

  function ouvrirPhoto(chemin) {
    var boite = document.getElementById("visionneuse");
    var img = document.getElementById("visionneuse-image");
    var attente = document.getElementById("visionneuse-attente");
    img.style.display = "none";
    attente.hidden = false;
    img.onload = function () { attente.hidden = true; img.style.display = ""; };
    img.onerror = function () { attente.textContent = "Photo indisponible."; };
    img.src = urlPhoto(chemin);   // la pleine résolution, chargée seulement ici
    boite.hidden = false;
    document.body.style.overflow = "hidden";
    document.querySelector("#visionneuse .fermer").focus();
  }

  function fermerPhoto() {
    var boite = document.getElementById("visionneuse");
    boite.hidden = true;
    document.getElementById("visionneuse-image").src = "";
    document.body.style.overflow = "";
  }

  document.getElementById("scanner").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-scan]");
    if (!b) return;
    var quoi = b.getAttribute("data-scan");
    if (quoi === "lampe") { basculerLampe(); return; }
    if (quoi === "photo") { var f = document.getElementById("isbn-photo"); if (f) f.click(); return; }
    if (quoi === "diagnostic") { afficherReleve(); return; }
    fermerScanner();
    if (quoi === "manuel") { var i = document.getElementById("d-isbn"); if (i) i.focus(); }
  });

  document.getElementById("isbn-photo").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (f) decoderImage(f);
  });

  document.getElementById("fiche").addEventListener("click", function (ev) {
    if (ev.target.closest('[data-fiche="fermer"]')) { fermerFiche(); return; }

    var ag = ev.target.closest("[data-agrandir]");
    if (ag) { ouvrirPhoto(ag.getAttribute("data-agrandir")); return; }

    var ouv = ev.target.closest("[data-ouvrir]");
    if (ouv) { ouvrirFiche(ouv.getAttribute("data-ouvrir")); return; }

    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    if (act === "reserver") reserver(id);
    else if (act === "annuler") annuler(id);
    else if (act === "confirmer") confirmer(id);
    else if (act === "retirer") { retirer(id); fermerFiche(); }
    else if (act === "signaler") signaler(id);
    else if (act === "signaler-motif") envoyerSignalement(id, b.getAttribute("data-motif"));
    else if (act === "signaler-annuler") annulerSignalement();
    else if (act === "ecrire") ouvrirDiscussion(id);
  });

  document.getElementById("visionneuse").addEventListener("click", fermerPhoto);
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!document.getElementById("scanner").hidden) { fermerScanner(); return; }
    if (!document.getElementById("visionneuse").hidden) { fermerPhoto(); return; }
    if (!document.getElementById("fiche").hidden) fermerFiche();
  });

  /* ---------------- évènements ---------------- */

  document.getElementById("balance").addEventListener("click", function (ev) {
    if (ev.target.closest('[data-act="deconnexion"]')) deconnecter();
  });

  document.getElementById("view").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var c = ev.target.closest("[data-ouvrir]");
    if (!c) return;
    ev.preventDefault();
    ouvrirFiche(c.getAttribute("data-ouvrir"));
  });

  // Le panneau de compte vit hors de #view : sans ce gestionnaire, la
  // bascule « J'ai déjà un compte » restait sans effet et personne ne
  // pouvait se reconnecter depuis un autre appareil.
  document.getElementById("onboard").addEventListener("click", function (ev) {
    if (ev.target.closest('[data-act="reinitialiser"]')) { reinitialiser(); return; }
    if (ev.target.closest('[data-act="deconnexion"]')) { deconnecter(); return; }
    var cp = ev.target.closest("[data-compte]");
    if (!cp) return;
    state.modeCompte = cp.getAttribute("data-compte");
    render();
  });

  document.getElementById("nav").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-onglet]");
    if (!b) return;
    state.onglet = b.getAttribute("data-onglet");
    state.filOuvert = null;
    state.filEnAttente = null;
    render();
    if (state.onglet === "moi") rafraichirPush().then(render);
    // Les fils sont relus à l'ouverture de l'onglet : un chargement raté
    // au démarrage laissait sinon la liste vide jusqu'au prochain
    // lancement, alors que les conversations existaient.
    if (state.onglet === "messages") chargerFils().then(render);
    window.scrollTo({ top: 0, behavior: "instant" });
  });

  document.getElementById("view").addEventListener("click", function (ev) {
    var seg = ev.target.closest("[data-mode]");
    if (seg) { state.filtre.mode = seg.getAttribute("data-mode"); render(); return; }

    var sugg = ev.target.closest("[data-sugg]");
    if (sugg) { appliquerSuggestion(sugg.getAttribute("data-sugg")); return; }

    var chip = ev.target.closest("[data-cat]");
    if (chip) { state.filtre.cat = chip.getAttribute("data-cat"); render(); return; }

    var ouv = ev.target.closest("[data-ouvrir]");
    if (ouv) { ouvrirFiche(ouv.getAttribute("data-ouvrir")); return; }

    var fil = ev.target.closest("[data-fil]");
    if (fil) {
      state.filOuvert = fil.getAttribute("data-fil");
      ouvrirFil(state.filOuvert);
      return;
    }

    var rr = ev.target.closest("[data-retirer-recherche]");
    if (rr) { retirerRecherche(rr.getAttribute("data-retirer-recherche")); return; }

    var sc = ev.target.closest("[data-scan]");
    if (sc) {
      var quoi = sc.getAttribute("data-scan");
      if (quoi === "ouvrir") ouvrirScanner();
      else if (quoi === "fermer") fermerScanner();
      else if (quoi === "manuel") { fermerScanner(); var i = document.getElementById("d-isbn"); if (i) i.focus(); }
      return;
    }

    var ag = ev.target.closest("[data-agrandir]");
    if (ag) { ouvrirPhoto(ag.getAttribute("data-agrandir")); return; }

    var cp = ev.target.closest("[data-compte]");
    if (cp) { state.modeCompte = cp.getAttribute("data-compte"); render(); return; }

    var ph = ev.target.closest("[data-photo]");
    if (ph) {
      retenirBrouillon();
      if (ph.getAttribute("data-photo") === "retirer") { state.photo = null; viderCoffre(); render(); }
      else { var i = document.getElementById("d-photo"); if (i) i.click(); }
      return;
    }

    var dep = ev.target.closest("[data-depot]");
    if (dep) { retenirBrouillon(); state.depotMode = dep.getAttribute("data-depot"); render(); return; }

    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");
    if (act === "reserver") reserver(id);
    else if (act === "annuler") annuler(id);
    else if (act === "confirmer") confirmer(id);
    else if (act === "retirer") retirer(id);
    else if (act === "signaler") signaler(id);
    else if (act === "reset") { state.filtre = { q: "", mode: "", cat: "", niveau: "" }; render(); }
    else if (act === "aller-catalogue") { state.onglet = "catalogue"; render(); }
    else if (act === "aller-depot") { state.onglet = "deposer"; render(); }
    else if (act === "deconnexion") deconnecter();
    else if (act === "ecrire") ouvrirDiscussion(id);
    else if (act === "retour-messages") { state.filOuvert = null; state.filEnAttente = null; render(); }
    else if (act === "reinitialiser") reinitialiser();
    else if (act === "push-on") activerPush();
    else if (act === "push-off") desactiverPush();
    else if (act === "push-essai") essaiNotification();
    else if (act === "moderer") moderer(id, b.getAttribute("data-decision"));
    else if (act === "supprimer-fiche") supprimerFiche(b.getAttribute("data-code"));
  });

  /* ---------------- démarrage ---------------- */

  render();

  // Si le serveur est injoignable, l'application reste consultable avec
  // le jeu d'exemples plutôt que d'afficher une page vide.
  function replier(raison) {
    state.pret = false;
    state.horsLigne = raison || "serveur injoignable";
    state.compte = null;   // sinon l'écran de compte affirme n'importe quoi
    state.membres = JSON.parse(JSON.stringify(EXEMPLES_MEMBRES));
    state.objets = EXEMPLES.slice();
    state.me = null;
    state.fils = []; state.messages = []; state.recherches = []; state.filOuvert = null;
    render();
  }

  function ecouterChangements() {
    state.sb.channel("casier")
      .on("postgres_changes", { event: "*", schema: "public", table: "objets" },
          function () { charger().catch(function () {}); })
      .on("postgres_changes", { event: "*", schema: "public", table: "membres" },
          function () { charger().catch(function () {}); })
      // Un message arrive sans rechargement : c'est ce qui rend une
      // négociation de rendez-vous vivable.
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" },
          function () {
            var suite = state.filOuvert ? chargerMessages(state.filOuvert) : Promise.resolve();
            suite.then(chargerFils).then(function () { render(); }).catch(function () {});
          })
      .on("postgres_changes", { event: "*", schema: "public", table: "recherches" },
          function () { chargerRecherches().then(function () { render(); }).catch(function () {}); })
      .subscribe();
  }

  // getSession() se contente de relire le jeton stocké dans le
  // navigateur : il survit à la suppression du compte côté serveur.
  // getUser() interroge le serveur et tranche vraiment. Sans cette
  // vérification, un compte supprimé laissait l'application persuadée
  // d'être connectée, réclamant un pseudo que la base refusera toujours.
  function sessionUtilisable() {
    return state.sb.auth.getSession()
      .then(function (r) {
        if (!(r.data && r.data.session)) return false;
        return state.sb.auth.getUser().then(function (u) {
          if (!u.error && u.data && u.data.user) return true;
          return state.sb.auth.signOut()
            .then(function () { return false; })
            .catch(function () { return false; });
        });
      })
      .catch(function () { return false; });
  }

  function demarrer() {
    if (typeof supabase === "undefined" || !supabase.createClient) {
      replier("bibliothèque cliente non chargée");
      return;
    }
    state.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Retour depuis un lien de réinitialisation : la bibliothèque lit le
    // jeton présent dans l'adresse, ouvre la session et nous prévient.
    // Le repli sur l'adresse couvre le cas où l'évènement passe avant
    // que nous soyons à l'écoute.
    // On exige le jeton, pas seulement la mention du type : sans cela,
    // écrire « ?type=recovery » dans la barre d'adresse suffirait à
    // ouvrir un formulaire qui ne peut rien changer.
    var retour = location.hash || "";
    if (/type=recovery/.test(retour) && /access_token=/.test(retour)) {
      state.recuperation = true;
    }
    state.sb.auth.onAuthStateChange(function (evenement) {
      if (evenement === "PASSWORD_RECOVERY") { state.recuperation = true; render(); }
    });

    // Connexion anonyme : chaque appareil reçoit une identité stable,
    // sans e-mail ni mot de passe. Elle sert à savoir qui dépose quoi.
    sessionUtilisable()
      .then(function (ok) {
        // Une session anonyme permet de consulter le catalogue avant de
        // s'inscrire ; déposer ou réserver demandera un vrai compte.
        if (ok) return null;
        return state.sb.auth.signInAnonymously().then(function (a) {
          if (a.error) throw a.error;
          return null;
        });
      })
      .then(relireSession)
      .then(function (u) {
        if (!u) throw new Error("session absente");
        return charger();
      })
      .then(function () {
        state.pret = true;
        ecouterChangements();
        return rafraichirPush();
      })
      .then(function () {
        // Notification touchée : on ouvre directement la conversation.
        var f = filDemande();
        if (f && state.me) {
          state.onglet = "messages";
          state.filOuvert = f;
          return ouvrirFil(f);
        }
        render();
      })
      .catch(function (e) {
        // Une connexion mobile coupe souvent une seconde au réveil : on
        // réessaie deux fois avant de basculer hors ligne.
        if (state.essais < 2) {
          state.essais++;
          setTimeout(demarrer, 1200 * state.essais);
          return;
        }
        replier(messageErreur(e));
      });
  }

  demarrer();

  // Revenir d'un tunnel ou rouvrir l'application ne doit pas laisser
  // l'écran figé sur un état dégradé.
  window.addEventListener("online", function () {
    if (!state.pret) { state.essais = 0; demarrer(); }
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !state.pret) { state.essais = 0; demarrer(); }
  });
})();
</script>

<script>
  // Enregistre le service worker : rend l'application installable et
  // utilisable hors ligne. Sans lui, la page fonctionne normalement.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        // iOS garde volontiers une ancienne version : on demande la
        // vérification à chaque ouverture, et on recharge une fois dès
        // qu'une nouvelle prend la main. Sans cela, un téléphone peut
        // rester des jours sur du code périmé.
        try { reg.update(); } catch (e) {}
        setInterval(function () { try { reg.update(); } catch (e) {} }, 60 * 60 * 1000);
      }).catch(function () {});

      var recharge = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (recharge) return;
        recharge = true;
        location.reload();
      });
    });
  }
</script>
</body>
</html>
