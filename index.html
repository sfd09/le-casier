<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Application installable (PWA) -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icones/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F8">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0E1421">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Le Casier">
<meta name="description" content="Dons, trocs et ventes de manuels et de fournitures entre élèves du lycée.">

<style>
  :root { color-scheme: light dark; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Le Casier du lycée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --paper:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#EDEFF4;
  --ink:#151D31;
  --muted:#5D6883;
  --faint:#8B94A8;
  --line:#DDE2EB;
  --line-strong:#C3CBDA;
  --accent:#2F5FE0;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EAFC;
  --ok:#17784E;
  --ok-soft:#DCF0E6;
  --warn:#9C6407;
  --warn-soft:#FBEED4;
  --done:#6C768C;
  --done-soft:#E5E8EF;
  --alert:#A32B33;
  --alert-soft:#F8E1E2;

  --c-manuel:#2F5FE0;
  --c-lecture:#B23A48;
  --c-calc:#7145B8;
  --c-materiel:#0C6F7C;
  --c-fournitures:#8A6A1C;
  --c-sport:#1B7A4F;
  --c-autre:#6C768C;

  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --shadow:0 1px 2px rgba(21,29,49,.05);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1421;
    --surface:#161E2E;
    --surface-2:#1E283B;
    --ink:#E8ECF4;
    --muted:#A3ADC2;
    --faint:#7C879E;
    --line:#28334A;
    --line-strong:#3A4761;
    --accent:#7C9BF5;
    --accent-ink:#0E1421;
    --accent-soft:#1E2A4A;
    --ok:#5FCB97;
    --ok-soft:#123326;
    --warn:#E5B45F;
    --warn-soft:#33270D;
    --done:#8B94A8;
    --done-soft:#222C3F;
    --alert:#F08A90;
    --alert-soft:#3A1B1E;

    --c-manuel:#7C9BF5;
    --c-lecture:#E8848F;
    --c-calc:#B394EE;
    --c-materiel:#4FBDCB;
    --c-fournitures:#D6B45C;
    --c-sport:#5FCB97;
    --c-autre:#8B94A8;

    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}

:root[data-theme="dark"]{
  --paper:#0E1421;
  --surface:#161E2E;
  --surface-2:#1E283B;
  --ink:#E8ECF4;
  --muted:#A3ADC2;
  --faint:#7C879E;
  --line:#28334A;
  --line-strong:#3A4761;
  --accent:#7C9BF5;
  --accent-ink:#0E1421;
  --accent-soft:#1E2A4A;
  --ok:#5FCB97;
  --ok-soft:#123326;
  --warn:#E5B45F;
  --warn-soft:#33270D;
  --done:#8B94A8;
  --done-soft:#222C3F;
  --alert:#F08A90;
  --alert-soft:#3A1B1E;

  --c-manuel:#7C9BF5;
  --c-lecture:#E8848F;
  --c-calc:#B394EE;
  --c-materiel:#4FBDCB;
  --c-fournitures:#D6B45C;
  --c-sport:#5FCB97;
  --c-autre:#8B94A8;

  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 72px}

/* ---------- barre haute ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.mark{
  display:flex;align-items:baseline;gap:9px;margin-right:auto;
  font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-weight:600;font-size:21px;letter-spacing:-.01em;
}
.mark .dot{
  width:9px;height:9px;border-radius:2px;background:var(--accent);
  align-self:center;flex:none;
}
.mark small{
  font-family:"Public Sans",sans-serif;font-weight:500;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
}

.balance{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 13px;box-shadow:var(--shadow);
}
.balance .who{display:flex;flex-direction:column;line-height:1.15;margin-right:2px}
.balance .who b{font-size:13px;font-weight:600}
.balance .who span{font-size:11px;color:var(--faint)}
.credits{
  display:flex;align-items:baseline;gap:4px;
  background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:5px 11px;
}
.credits b{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.credits span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.dons{
  display:flex;align-items:baseline;gap:4px;
  background:var(--ok-soft);color:var(--ok);
  border-radius:999px;padding:5px 10px;
}
.dons b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dons span{font-size:10px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- onglets ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;appearance:none;background:none;border:0;cursor:pointer;
  font:inherit;font-weight:500;color:var(--muted);
  padding:8px 13px 11px;border-bottom:2px solid transparent;
  border-radius:6px 6px 0 0;white-space:nowrap;
}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{
  font-family:var(--mono);font-size:11px;color:var(--faint);
  margin-left:5px;font-variant-numeric:tabular-nums;
}

/* ---------- filtres ---------- */
.filters{padding:22px 0 6px;display:flex;flex-direction:column;gap:11px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input[type="search"]{flex:1 1 220px}

input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;
  padding:9px 11px;width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
label .opt{font-weight:400;color:var(--faint)}

.seg{
  display:inline-flex;background:var(--surface-2);border-radius:9px;
  padding:3px;gap:2px;align-self:flex-start;max-width:100%;overflow-x:auto;
  scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  background:none;color:var(--muted);padding:6px 14px;border-radius:7px;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chiprail{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:500;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;
  display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip .swatch{width:9px;height:9px;border-radius:2px;background:var(--sw,var(--c-autre));flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- grille ---------- */
.count{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:16px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.count b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.count .lbl{font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}

.obj{
  position:relative;display:flex;flex-direction:column;gap:8px;
  background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--sw,var(--c-autre));
  border-radius:var(--r);padding:13px 14px 12px;
}
.obj.gone{opacity:.62}
.vignette{
  position:relative;aspect-ratio:4/3;border-radius:7px;overflow:hidden;
  background:color-mix(in srgb,var(--sw) 9%,var(--surface-2));
  display:flex;align-items:center;justify-content:center;
}
.vignette img{width:100%;height:100%;object-fit:cover;display:block}
.vignette span{
  font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--sw);opacity:.7;padding:0 10px;text-align:center;
}
.vignette[data-agrandir]{cursor:zoom-in}
.vignette .loupe{
  position:absolute;right:7px;bottom:7px;
  background:rgba(21,29,49,.72);color:#fff;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;opacity:0;transition:opacity .15s;
  pointer-events:none;
}
.vignette:hover .loupe,.vignette:focus-within .loupe{opacity:1}

.scanner{
  position:fixed;inset:0;z-index:95;background:#0A0E18;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.scanner[hidden]{display:none!important}
.scanner video{
  width:100%;max-width:560px;max-height:64vh;object-fit:cover;
  border-radius:12px;background:#000;
}
.viseur{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(78%,420px);height:130px;pointer-events:none;
  border:2px solid rgba(255,255,255,.85);border-radius:10px;
  box-shadow:0 0 0 2000px rgba(10,14,24,.45);
}
.scanner-texte{
  color:#fff;font-size:14px;font-weight:500;margin:20px 0 0;
  text-align:center;padding:0 24px;max-width:420px;line-height:1.45;
}
.scanner-texte small{display:block;color:rgba(255,255,255,.6);font-size:12px;margin-top:6px}
.scanner-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.releve{
  margin:14px 16px 0;padding:12px 14px;max-width:560px;max-height:34vh;overflow:auto;
  background:rgba(255,255,255,.09);color:#fff;border-radius:9px;
  font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;text-align:left;
}
.releve[hidden]{display:none!important}
.scanner-actions .btn{background:rgba(255,255,255,.14);color:#fff;border:0}
.scanner-actions .btn:hover{background:rgba(255,255,255,.24)}
.scanner-actions .btn.primary{background:var(--accent);color:#fff}

.visionneuse{
  position:fixed;inset:0;z-index:90;
  background:rgba(10,14,24,.92);
  display:flex;align-items:center;justify-content:center;
  padding:24px;cursor:zoom-out;
}
.visionneuse[hidden]{display:none!important}
.visionneuse img{
  max-width:100%;max-height:100%;
  border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.5);
  background:#151D31;
}
.visionneuse .fermer{
  position:absolute;top:16px;right:16px;
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff;
  padding:8px 15px;border-radius:8px;
}
.visionneuse .fermer:hover{background:rgba(255,255,255,.24)}
.visionneuse .chargement{color:#fff;font-size:13px;opacity:.8}

.photo-champ{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.aide-scan{margin:7px 0 0;font-size:12px;color:var(--faint);line-height:1.4}
.photo-etat{font-size:13px;color:var(--muted)}
.photo-apercu{
  margin-top:11px;max-width:230px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);
}
.photo-apercu img{display:block;width:100%;height:auto}
.obj-head{display:flex;gap:8px;align-items:flex-start}
.obj h3{
  margin:0;font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
  text-wrap:balance;flex:1;
}
.obj .auteur{margin:-3px 0 0;color:var(--muted);font-size:13px}
.obj .note{font-size:13px;color:var(--muted);margin:0}
.obj .isbn{font-family:var(--mono);font-size:11px;color:var(--faint)}

.mode{
  display:inline-flex;align-items:baseline;gap:6px;align-self:flex-start;
  border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;
}
.mode.don{background:var(--ok-soft);color:var(--ok)}
.mode.troc{background:var(--accent-soft);color:var(--accent)}
.mode.vente{
  background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line-strong);
}
.mode.vente b{
  font-family:var(--mono);font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.mode.vente span{font-weight:500;color:var(--muted);font-size:11px}

.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:3px}
.tag{
  font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--muted);white-space:nowrap;
}
.tag.cat{color:var(--sw);background:color-mix(in srgb,var(--sw) 12%,transparent)}
.pill{
  font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none;
}
.pill.dispo{background:var(--ok-soft);color:var(--ok)}
.pill.reserve{background:var(--warn-soft);color:var(--warn)}
.pill.echange{background:var(--done-soft);color:var(--done)}
.pill.signale{background:var(--alert-soft);color:var(--alert)}

.owner{
  font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px;
  border-top:1px solid var(--line);padding-top:9px;margin-top:2px;
}
.owner b{color:var(--muted);font-weight:600}
.contact{
  background:var(--warn-soft);color:var(--warn);border-radius:7px;
  padding:8px 11px;font-size:12px;font-weight:500;
}
.contact b{font-weight:700}
.obj-actions{display:flex;gap:7px;align-items:center}
.obj-actions .btn{flex:1}

/* ---------- boutons ---------- */
.btn{
  appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  border-radius:8px;padding:8px 13px;border:1px solid transparent;
  background:var(--surface-2);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.give{background:var(--ok);color:#fff}
.btn.give:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.icon{padding:8px 10px;flex:none;background:none;color:var(--faint);border-color:var(--line)}
.btn.icon:hover{color:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{filter:none;background:var(--surface-2)}

/* ---------- panneaux ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;box-shadow:var(--shadow);
}
.panel + .panel{margin-top:12px}
.panel h2{
  margin:0 0 4px;font-family:"Fraunces",Georgia,serif;
  font-size:20px;font-weight:600;letter-spacing:-.01em;
}
.panel .sub{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:62ch}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.form-foot{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
}
.form-foot p{margin:0;font-size:13px;color:var(--muted);flex:1;min-width:200px}

.modepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.modepick button{
  appearance:none;cursor:pointer;font:inherit;text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:9px;padding:12px 13px;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;
}
.modepick button:hover{border-color:var(--muted)}
.modepick button[aria-pressed="true"]{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.modepick b{font-size:14px;font-weight:600}
.modepick span{font-size:12px;color:var(--muted);line-height:1.35}

.notice{
  background:var(--warn-soft);color:var(--warn);border-radius:8px;
  padding:11px 14px;font-size:13px;margin:14px 0 0;
}
.notice b{font-weight:700}

.empty{
  text-align:center;padding:44px 20px;color:var(--muted);
  border:1px dashed var(--line-strong);border-radius:var(--r);
}
.empty p{margin:0 0 14px}

.section-title{
  font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;
  margin:26px 0 12px;display:flex;align-items:baseline;gap:9px;
}
.section-title span{
  font-family:var(--mono);font-size:11px;color:var(--faint);
  font-weight:400;font-variant-numeric:tabular-nums;
}

/* ---------- première visite ---------- */
.onboard{
  border:1px solid var(--accent);background:var(--accent-soft);
  border-radius:var(--r);padding:20px;margin:22px 0 0;
}
.onboard h2{margin:0 0 4px;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.onboard p{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:56ch}
.onboard .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.onboard .row > div{flex:1 1 150px}
.onboard label{color:var(--muted)}

.compte-bascule{
  display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:3px;margin:0 0 16px;align-self:flex-start;
}
.compte-bascule button{
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  background:none;color:var(--muted);padding:7px 15px;border-radius:7px;white-space:nowrap;
}
.compte-bascule button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.compte-champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.compte-champs .full{grid-column:1/-1}
.domaine{
  font-family:var(--mono);font-size:12px;color:var(--accent);
  background:var(--accent-soft);padding:2px 7px;border-radius:5px;
}
.deconnexion{
  appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:11px;color:var(--faint);text-decoration:underline;padding:0;margin-left:2px;
}
.deconnexion:hover{color:var(--alert)}

/* ---------- le projet ---------- */
.prose{max-width:66ch}
.prose h3{font-family:"Fraunces",Georgia,serif;font-size:16px;font-weight:600;margin:22px 0 7px}
.prose h3:first-child{margin-top:0}
.prose p{margin:0 0 11px;color:var(--muted)}
.prose ul{margin:0 0 11px;padding-left:19px;color:var(--muted)}
.prose li{margin-bottom:5px}
.prose strong{color:var(--ink);font-weight:600}

.circuits{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 16px}
.circuit{
  border:1px solid var(--line);border-top:3px solid var(--sw);
  border-radius:9px;padding:14px 15px;background:var(--surface);
}
.circuit b{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.circuit p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.circuit .flux{
  font-family:var(--mono);font-size:12px;
  color:var(--sw);font-weight:500;
}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{
  counter-increment:s;position:relative;padding:0 0 16px 34px;
  border-left:1px solid var(--line);margin-left:11px;
}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{
  content:counter(s);position:absolute;left:-11px;top:0;
  width:22px;height:22px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line-strong);
  color:var(--muted);font-family:var(--mono);font-size:11px;
  display:flex;align-items:center;justify-content:center;
}
.steps li b{display:block;font-size:14px;margin-bottom:2px}
.steps li p{margin:0;font-size:13px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--sw);flex:none}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
  box-shadow:0 6px 22px rgba(21,29,49,.22);z-index:80;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast[hidden]{display:none!important}

.status-line{font-size:12px;color:var(--faint);padding:14px 0 0;text-align:center}
.status-line b{color:var(--muted);font-weight:600}

@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
}

@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .obj{padding:11px 12px}
  .obj h3{font-size:15px}
  .mark{font-size:19px}
  .mark small{display:none}
  .panel{padding:16px}
  .balance .who{display:none}
}

    c.width = Math.max(1, Math.round(d.l * r));

    var c = document.createElement("canvas");
    c.width = L; c.height = H;
    c.getContext("2d").drawImage(src, sx, sy, sl, sh, 0, 0, L, H);

      if (t.indexOf(ERREURS_AUTH[i][0]) !== -1) return ERREURS_AUTH[i][1];
    }
    return messageErreur(e);
  }

  function relireSession() {
    return state.sb.auth.getSession().then(function (r) {
      var u = r.data && r.data.session ? r.data.session.user : null;
      state.moiId = u ? u.id : null;
      state.compte = u ? { email: u.email || "", anonyme: !u.email } : null;
      return u;
    });
  }

  // Inscription. Si l'appareil a déjà une session anonyme, on la CONVERTIT
  // au lieu d'en créer une seconde : l'identifiant ne change pas, donc les
  // annonces et les crédits déjà accumulés sont conservés.
  function bonDomaine(email) {
    return String(email || "").toLowerCase().split("@")[1] === DOMAINE;
  }

  function inscrire(email, motdepasse, pseudo, classe) {
    if (state.occupe) return;
    // Contrôle immédiat, pour ne pas faire attendre un aller-retour réseau
    // sur une erreur évidente. La vraie barrière reste dans la base.
    if (!bonDomaine(email)) {
      toast("Inscription réservée aux élèves : utilisez votre adresse @" + DOMAINE + ".");
      return;
    }
    state.occupe = true; render();

    var suite;
    if (state.compte && state.compte.anonyme) {
      suite = state.sb.auth.updateUser({ email: email, password: motdepasse })
        .then(function (r) { if (r.error) throw r.error; });
    } else {
      suite = state.sb.auth.signUp({ email: email, password: motdepasse })
        .then(function (r) { if (r.error) throw r.error; });
    }

    suite
      .then(relireSession)
      .then(function () { return rpc("creer_membre", { p_pseudo: pseudo, p_classe: classe || "" }); })
      .then(charger)
      .then(function () {
        state.occupe = false; render();
        toast("Compte créé. Vous vous retrouverez sur tous vos appareils.");
      })
      .catch(function (e) {
        state.occupe = false; render();
        toast(messageAuth(e));
      });
  }

  function connecter(email, motdepasse) {
    if (state.occupe) return;
    state.occupe = true; render();

    state.sb.auth.signInWithPassword({ email: email, password: motdepasse })
      .then(function (r) { if (r.error) throw r.error; })
      .then(relireSession)
      .then(charger)
      .then(function () {
        state.occupe = false;
        state.onglet = "catalogue";
        render();
        toast(state.me ? "Bonjour " + state.me.pseudo + "." : "Connexion réussie.");
      })
      .catch(function (e) {
        state.occupe = false; render();
        toast(messageAuth(e));
      });
  }

  function deconnecter() {
    state.sb.auth.signOut()
      .then(function () {
        state.me = null; state.compte = null; state.moiId = null;
        return state.sb.auth.signInAnonymously();
      })
      .then(relireSession)
      .then(charger)
      .then(function () { toast("Déconnecté."); })
      .catch(function () { location.reload(); });
  }

  function creerCompte(pseudo, classe) {
    rpc("creer_membre", { p_pseudo: pseudo, p_classe: classe || "" })
      .then(charger)
      .then(function () { toast("Bienvenue " + pseudo + " — 2 crédits pour démarrer les échanges."); })
      .catch(echec);
  }

  function deposer(o) {
    rpc("deposer_objet", {
      p_titre: o.titre, p_auteur: o.auteur, p_isbn: o.isbn,
      p_categorie: o.cat, p_matiere: o.matiere, p_niveau: o.niveau,
      p_etat: o.etat, p_note: o.note, p_mode: o.mode, p_prix: o.prix,
      p_photo: o.photo || null, p_photo_min: o.photoMin || null
    }).then(function () {
      state.photo = null;
      state.onglet = "catalogue";
      // La saisie de cet élève devient la fiche du lycée pour cet ISBN :
      // les suivants n'auront plus à la refaire.
      if (o.isbn && /^[0-9]{13}$/.test(o.isbn) && o.titre) {
        rpc("enregistrer_fiche", {
          p_isbn: o.isbn, p_titre: o.titre, p_auteur: o.auteur || "",
          p_categorie: o.cat || "", p_matiere: o.matiere || "", p_niveau: o.niveau || ""
        }).catch(function () {});   // sans conséquence si l'enregistrement échoue
      }
      return charger();
    }).then(function () {
      if (o.mode === "troc")     toast("Annonce publiée. +1 crédit.");
      else if (o.mode === "don") toast("Don publié. Merci — ça fait vivre le service.");
      else toast("Annonce publiée à " + prixFmt(o.prix) + ". Le règlement se fait en main propre.");
    }).catch(echec);
  }

  function trouver(id) {
    for (var i = 0; i < state.objets.length; i++) if (state.objets[i].id === id) return state.objets[i];
    return null;
  }

  function reserver(id) {
    var o = trouver(id);
    rpc("reserver_objet", { p_objet: id }).then(charger).then(function () {
      if (!o) return;
      if (o.mode === "troc")     toast("Réservé — 1 crédit débité. Retrait au CDI.");
      else if (o.mode === "don") toast("Réservé. Contactez " + o.proprietaire + " pour le retrait au CDI.");
      else toast("Réservé à " + prixFmt(o.prix) + ". Paiement en main propre, l'application n'encaisse rien.");
    }).catch(echec);
  }

  function annuler(id) {
    var o = trouver(id);
    rpc("annuler_reservation", { p_objet: id }).then(charger).then(function () {
      toast(o && o.mode === "troc" ? "Réservation annulée. Crédit rendu." : "Réservation annulée.");
    }).catch(echec);
  }

  function confirmer(id) {
    var o = trouver(id);
    rpc("confirmer_echange", { p_objet: id }).then(charger).then(function () {
      if (o && o.mode === "don") toast("C'est noté. Un don de plus au compteur de " + o.proprietaire + ".");
      else toast("Échange confirmé.");
    }).catch(echec);
  }

  function retirer(id) {
    var o = trouver(id);
    // La photo part en premier : le stockage n'accepte cette suppression
    // que de son propriétaire, et l'annonce en porte seule le chemin.
    var fichiers = [];
    if (o && o.photo) fichiers.push(o.photo);
    if (o && o.photoMin) fichiers.push(o.photoMin);
    var prealable = fichiers.length
      ? state.sb.storage.from("photos").remove(fichiers).catch(function () {})
      : Promise.resolve();

    prealable
      .then(function () { return rpc("retirer_objet", { p_objet: id }); })
      .then(charger)
      .then(function () { toast("Annonce retirée."); })
      .catch(echec);
  }

  function signaler(id) {
    rpc("signaler_objet", { p_objet: id }).then(charger)
      .then(function () { toast("Signalé. Un adulte référent va vérifier l'annonce."); }).catch(echec);
  }

  /* ---------------- rendu ---------------- */

  function renderBalance() {
    var el = document.getElementById("balance");
    if (!state.me) { el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "";
    var m = moiMembre() || { credits: 0, dons: 0 };
    el.innerHTML =
      '<div class="who"><b>' + esc(state.me.pseudo) + "</b><span>" + esc(state.me.classe || "—") +
        (estConnecte() ? ' <button class="deconnexion" data-act="deconnexion">quitter</button>' : "") +
        "</span></div>" +
      ((m.dons || 0) > 0 ? '<div class="dons" title="Objets donnés"><b>' + m.dons + "</b><span>dons</span></div>" : "") +
      '<div class="credits"><b>' + (m.credits || 0) + "</b><span>crédits</span></div>";
  }

  function renderOnboard() {
    var el = document.getElementById("onboard");

    // Trois situations : pas encore de compte, compte sans pseudo, ou tout est en place.
    if (state.me) { el.innerHTML = ""; return; }
    if (!state.sb || !state.compte) { el.innerHTML = ""; return; }

    if (estConnecte()) { el.innerHTML = formulairePseudo(); brancherPseudo(); return; }

    var inscription = state.modeCompte === "inscription";
    el.innerHTML =
      '<div class="onboard">' +
        '<div class="compte-bascule" role="group">' +
          '<button data-compte="inscription" aria-pressed="' + inscription + '">Créer mon compte</button>' +
          '<button data-compte="connexion" aria-pressed="' + (!inscription) + '">J\'ai déjà un compte</button>' +
        "</div>" +
        (inscription
          ? "<h2>Créer votre compte</h2><p>Réservé aux élèves du lycée : votre adresse " +
            '<span class="domaine">@' + DOMAINE + "</span>. " +
            "Un seul compte, que vous retrouverez sur le téléphone comme sur les ordinateurs du CDI. " +
            "Votre adresse ne s'affiche nulle part dans l'application — les autres élèves ne voient que votre pseudo.</p>"
          : "<h2>Se connecter</h2><p>Retrouvez votre pseudo, vos crédits et vos annonces, " +
            "sur n'importe quel appareil.</p>") +
        '<form id="f-compte">' +
          '<div class="compte-champs">' +
            '<div class="full"><label for="c-email">Adresse du lycée</label>' +
              '<input id="c-email" type="email" required autocomplete="email" ' +
              'placeholder="prenom.nom@' + DOMAINE + '"></div>' +
            '<div><label for="c-mdp">Mot de passe</label>' +
              '<input id="c-mdp" type="password" required minlength="6" ' +
              'autocomplete="' + (inscription ? "new-password" : "current-password") + '" ' +
              'placeholder="6 caractères minimum"></div>' +
            (inscription
              ? '<div><label for="c-pseudo">Pseudo</label>' +
                  '<input id="c-pseudo" required maxlength="20" placeholder="Nawel" autocomplete="off"></div>' +
                '<div><label for="c-classe">Classe</label>' +
                  '<input id="c-classe" maxlength="12" placeholder="1re G2" autocomplete="off"></div>'
              : "") +
          "</div>" +
          '<div style="margin-top:16px">' +
            '<button class="btn primary" type="submit"' + (state.occupe ? " disabled" : "") + ">" +
              (state.occupe ? "Un instant…" : (inscription ? "Créer mon compte" : "Se connecter")) +
            "</button>" +
          "</div>" +
        "</form>" +
      "</div>";

    document.getElementById("f-compte").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var email = document.getElementById("c-email").value.trim().toLowerCase();
      var mdp = document.getElementById("c-mdp").value;
      if (state.modeCompte === "inscription") {
        var pseudo = document.getElementById("c-pseudo").value.trim();
        if (!pseudo) return;
        inscrire(email, mdp, pseudo, document.getElementById("c-classe").value.trim());
      } else {
        connecter(email, mdp);
      }
    });
  }

  // Cas rare : le compte existe mais le pseudo n'a pas été enregistré.
  function formulairePseudo() {
    return '<div class="onboard">' +
      "<h2>Il ne manque que votre pseudo</h2>" +
      "<p>Votre compte est créé. Choisissez le nom sous lequel les autres élèves vous verront — " +
      "pas votre nom de famille.</p>" +
      '<form class="row" id="f-pseudo">' +
        '<div><label for="p-pseudo">Pseudo</label>' +
          '<input id="p-pseudo" required maxlength="20" placeholder="Nawel" autocomplete="off"></div>' +
        '<div><label for="p-classe">Classe</label>' +
          '<input id="p-classe" maxlength="12" placeholder="1re G2" autocomplete="off"></div>' +
        '<button class="btn primary" type="submit">Valider</button>' +
      "</form>" +
    "</div>";
  }

  function brancherPseudo() {
    var f = document.getElementById("f-pseudo");
    if (!f) return;
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = document.getElementById("p-pseudo").value.trim();
      if (!p) return;
      creerCompte(p, document.getElementById("p-classe").value.trim());
    });
  }

  function estActif(o) { return o.statut !== "echange" && !o.signale; }

  function renderTabs() {
    var dispo = state.objets.filter(function (o) { return o.statut === "dispo" && !o.signale; }).length;
    var miens = state.me ? state.objets.filter(estAMoi).length : 0;
    var defs = [
      { id: "catalogue", nom: "Catalogue", n: dispo },
      { id: "deposer", nom: "Déposer", n: null },
      { id: "mes", nom: "Mes échanges", n: miens },
      { id: "projet", nom: "Le projet", n: null }
    ];
    var html = "";
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      html += '<button class="tab" role="tab" data-tab="' + d.id + '" aria-selected="' +
        (state.onglet === d.id) + '">' + d.nom +
        (d.n !== null ? '<span class="n">' + d.n + "</span>" : "") + "</button>";
    }
    document.getElementById("tabs").innerHTML = html;
  }

  function estAMoi(o) {
    if (!state.me) return false;
    return o.proprietaireCle === state.me.cle || o.reserveParCle === state.me.cle;
  }

  function badgeMode(o) {
    if (o.mode === "don") return '<span class="mode don">Gratuit · don</span>';
    if (o.mode === "vente") {
      return '<span class="mode vente"><b>' + prixFmt(o.prix) + "</b><span>en main propre</span></span>";
    }
    return '<span class="mode troc">Troc · 1 crédit</span>';
  }

  function carte(o, contexte) {
    var couleur = sw(o.cat);
    var suisProprio = state.me && o.proprietaireCle === state.me.cle;
    var suisPreneur = state.me && o.reserveParCle === state.me.cle;

    var pill, cls = "";
    if (o.signale) { pill = '<span class="pill signale">Signalé</span>'; cls = " gone"; }
    else if (o.statut === "echange") { pill = '<span class="pill echange">Terminé</span>'; cls = " gone"; }
    else if (o.statut === "reserve") { pill = '<span class="pill reserve">Réservé</span>'; }
    else { pill = '<span class="pill dispo">Dispo</span>'; }

    var actions = "";
    if (state.me && !o.signale) {
      if (o.statut === "dispo" && !suisProprio) {
        var libelle = o.mode === "don" ? "Je le prends"
                    : o.mode === "vente" ? "Ça m'intéresse"
                    : "Réserver · 1 crédit";
        var classe = o.mode === "don" ? "give" : "primary";
        actions =
          '<button class="btn ' + classe + '" data-act="reserver" data-id="' + o.id + '">' + libelle + "</button>" +
          '<button class="btn icon" data-act="signaler" data-id="' + o.id + '" title="Signaler cette annonce" aria-label="Signaler cette annonce">⚑</button>';
      } else if (o.statut === "dispo" && suisProprio) {
        actions = '<button class="btn ghost" data-act="retirer" data-id="' + o.id + '">Retirer l\'annonce</button>';
      } else if (o.statut === "reserve" && suisPreneur) {
        actions =
          '<button class="btn primary" data-act="confirmer" data-id="' + o.id + '">C\'est récupéré</button>' +
          '<button class="btn ghost" data-act="annuler" data-id="' + o.id + '">Annuler</button>';
      } else if (o.statut === "reserve" && suisProprio) {
        actions = '<button class="btn ghost" disabled>En attente de ' + esc(o.reservePar || "…") + "</button>";
      }
    }

    // Le rendez-vous n'apparaît qu'aux deux personnes concernées.
    var contact = "";
    if (o.statut === "reserve" && (suisProprio || suisPreneur)) {
      var autre = suisProprio
        ? esc(o.reservePar) + " (" + esc(o.reserveParClasse || "classe non renseignée") + ")"
        : esc(o.proprietaire) + " (" + esc(o.classe || "classe non renseignée") + ")";
      contact = '<div class="contact">Rendez-vous au CDI avec <b>' + autre + "</b>" +
        (o.mode === "vente" ? " · règlement de " + prixFmt(o.prix) + " en main propre" : "") + "</div>";
    }

    return (
      '<article class="obj' + cls + '" style="--sw:' + couleur + '">' +
        '<div class="vignette"' + (o.photo ? ' data-agrandir="' + esc(o.photo) + '" title="Agrandir"' : "") + ">" +
          (o.photo
            ? '<img src="' + esc(urlPhoto(o.photoMin || o.photo)) + '" alt="Photo de ' +
              esc(o.titre) + '" loading="lazy" decoding="async">' +
              '<span class="loupe" aria-hidden="true">agrandir</span>'
            : "<span>" + esc(catNom(o.cat)) + "</span>") +
        "</div>" +
        '<div class="obj-head"><h3>' + esc(o.titre) + "</h3>" + pill + "</div>" +
        (o.auteur ? '<p class="auteur">' + esc(o.auteur) + "</p>" : "") +
        badgeMode(o) +
        (o.note ? '<p class="note">' + esc(o.note) + "</p>" : "") +
        (o.isbn ? '<span class="isbn">ISBN ' + esc(o.isbn) + "</span>" : "") +
        '<div class="meta">' +
          '<span class="tag cat">' + esc(catNom(o.cat)) + "</span>" +
          (o.matiere ? '<span class="tag">' + esc(o.matiere) + "</span>" : "") +
          (o.niveau ? '<span class="tag">' + esc(o.niveau) + "</span>" : "") +
          '<span class="tag">' + esc(o.etat) + "</span>" +
        "</div>" +
        contact +
        '<div class="owner">' +
          (contexte === "mes" && suisPreneur && !suisProprio
            ? "Chez <b>" + esc(o.proprietaire) + "</b>" + (o.classe ? " · " + esc(o.classe) : "")
            : "Déposé par <b>" + esc(o.proprietaire) + "</b>" + (o.classe ? " · " + esc(o.classe) : "")) +
        "</div>" +
        (actions ? '<div class="obj-actions">' + actions + "</div>" : "") +
      "</article>"
    );
  }

  function filtrer() {
    var q = state.filtre.q.toLowerCase().trim();
    return state.objets.filter(function (o) {
      if (!estActif(o)) return false;
      if (state.filtre.mode && o.mode !== state.filtre.mode) return false;
      if (state.filtre.cat && o.cat !== state.filtre.cat) return false;
      if (state.filtre.niveau && o.niveau !== state.filtre.niveau) return false;
      if (q) {
        var foin = (o.titre + " " + (o.auteur || "") + " " + (o.isbn || "") + " " +
                    catNom(o.cat) + " " + (o.matiere || "")).toLowerCase();
        if (foin.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function vueCatalogue() {
    var modes = [["", "Tout"], ["don", "Dons"], ["troc", "Trocs"], ["vente", "Ventes"]];
    var seg = "";
    for (var m = 0; m < modes.length; m++) {
      seg += '<button data-mode="' + modes[m][0] + '" aria-pressed="' +
        (state.filtre.mode === modes[m][0]) + '">' + modes[m][1] + "</button>";
    }

    var chips = '<button class="chip" data-cat="" aria-pressed="' + (!state.filtre.cat) + '">Toutes catégories</button>';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      chips += '<button class="chip" data-cat="' + c.id + '" style="--sw:' + sw(c.id) + '" aria-pressed="' +
        (state.filtre.cat === c.id) + '"><span class="swatch"></span>' + c.nom + "</button>";
    }

    var opts = '<option value="">Tous niveaux</option>';
    for (var j = 0; j < NIVEAUX.length; j++) {
      opts += '<option value="' + NIVEAUX[j] + '"' + (state.filtre.niveau === NIVEAUX[j] ? " selected" : "") + ">" + NIVEAUX[j] + "</option>";
    }

    var res = filtrer();
    var gratuits = res.filter(function (o) { return o.mode === "don"; }).length;
    var corps = res.length
      ? '<div class="grid">' + res.map(function (o) { return carte(o, "catalogue"); }).join("") + "</div>"
      : '<div class="empty"><p>Rien ne correspond à ces filtres.</p>' +
        '<button class="btn ghost" data-act="reset">Tout afficher</button></div>';

    return (
      '<div class="filters">' +
        '<div class="search">' +
          '<input type="search" id="q" placeholder="Chercher un titre, une matière, un ISBN…" value="' + esc(state.filtre.q) + '" aria-label="Rechercher">' +
          '<select id="niv" aria-label="Filtrer par niveau" style="flex:0 0 160px;width:auto">' + opts + "</select>" +
        "</div>" +
        '<div class="seg" role="group" aria-label="Filtrer par type d\'échange">' + seg + "</div>" +
        '<div class="chiprail">' + chips + "</div>" +
      "</div>" +
      '<div class="count">' +
        '<span class="lbl"><b>' + res.length + "</b> annonce" + (res.length > 1 ? "s" : "") +
        (gratuits ? " · dont <b>" + gratuits + "</b> gratuite" + (gratuits > 1 ? "s" : "") : "") + "</span>" +
        '<span class="lbl">Remise au CDI</span>' +
      "</div>" + corps
    );
  }

  function vueDeposer() {
    if (!state.me) {
      return '<div class="panel"><h2>Créez votre compte pour déposer</h2>' +
        '<p class="sub">Le catalogue est consultable librement, mais déposer ou réserver ' +
        'demande un compte — c\'est ce qui permet de savoir à qui rendre le livre. ' +
        'Le formulaire est en haut de la page, il prend trente secondes.</p></div>';
    }

    var cats = "";
    for (var i = 0; i < CATEGORIES.length; i++) cats += '<option value="' + CATEGORIES[i].id + '">' + CATEGORIES[i].nom + "</option>";
    var mats = '<option value="">Non concerné</option>';
    for (var j = 0; j < MATIERES.length; j++) mats += '<option value="' + MATIERES[j] + '">' + MATIERES[j] + "</option>";
    var nivs = '<option value="">Tous niveaux</option>';
    for (var k = 0; k < NIVEAUX.length; k++) nivs += '<option value="' + NIVEAUX[k] + '">' + NIVEAUX[k] + "</option>";
    var ets = "";
    for (var l = 0; l < ETATS.length; l++) ets += '<option value="' + ETATS[l] + '">' + ETATS[l] + "</option>";

    var choix = [
      ["don", "Je donne", "Gratuit, sans contrepartie. Votre compteur de dons augmente."],
      ["troc", "J'échange", "Vous gagnez 1 crédit tout de suite ; la personne qui le prend en dépense 1."],
      ["vente", "Je vends", "Prix indicatif, plafonné à " + PLAFOND_PRIX + " €. Le règlement se fait en main propre."]
    ];
    var pick = "";
    for (var p = 0; p < choix.length; p++) {
      pick += '<button type="button" data-depot="' + choix[p][0] + '" aria-pressed="' +
        (state.depotMode === choix[p][0]) + '"><b>' + choix[p][1] + "</b><span>" + choix[p][2] + "</span></button>";
    }

    var champPrix = state.depotMode === "vente"
      ? '<div><label for="d-prix">Prix demandé <span class="opt">(max ' + PLAFOND_PRIX + ' €)</span></label>' +
        '<input id="d-prix" type="number" min="1" max="' + PLAFOND_PRIX + '" step="0.5" required placeholder="15"></div>'
      : "";

  /* ---------------- scan de l'ISBN ---------------- */

  // Un livre porte SOUVENT DEUX codes-barres : l'EAN-13 qui encode
  // l'ISBN, et un petit code additionnel à 5 chiffres pour le prix.
  // Il faut donc examiner tous les codes détectés et retenir celui qui
  // est un ISBN, au lieu de prendre le premier venu.

  function cleEan13(c) {
    var somme = 0;
    for (var i = 0; i < 12; i++) somme += (+c[i]) * (i % 2 ? 3 : 1);
    return (10 - (somme % 10)) % 10 === +c[12];
  }

  function cleIsbn10(c) {
    var somme = 0;
    for (var i = 0; i < 9; i++) somme += (+c[i]) * (10 - i);
    var d = c[9] === "X" ? 10 : +c[9];
    return (somme + d) % 11 === 0;
  }

  // Les livres d'avant 2007 portent un ISBN-10 : on le convertit plutôt
  // que de le rejeter, sinon la moitié d'un CDI serait illisible.
  function isbn10Vers13(c) {
    var base = "978" + c.slice(0, 9);
    var somme = 0;
    for (var i = 0; i < 12; i++) somme += (+base[i]) * (i % 2 ? 3 : 1);
    return base + ((10 - (somme % 10)) % 10);
  }

  function normaliserIsbn(brut) {
    var c = String(brut || "").toUpperCase().replace(/[^0-9X]/g, "");
    if (c.length === 13 && /^97[89]/.test(c) && cleEan13(c)) return c;
    if (c.length === 10 && cleIsbn10(c)) return isbn10Vers13(c);
    return null;
  }

  function isbnValide(code) { return !!normaliserIsbn(code); }

  // Beaucoup de livres portent, à côté du code-barres, un QR code menant
  // à la fiche de l'éditeur — et cette adresse contient souvent l'EAN.
  // Un QR se lit bien plus facilement qu'un code-barres : il est
  // bidimensionnel et corrige ses propres erreurs, là où un EAN-13 exige
  // une image nette. On accepte donc les deux, et on cherche un ISBN
  // partout dans le texte décodé.
  function isbnDansTexte(t) {
    var brut = String(t || "");
    var compact = brut.replace(/[^0-9Xx]/g, "");
    var direct = normaliserIsbn(brut);
    if (direct) return direct;

    var m = compact.match(/97[89][0-9]{10}/g) || [];
    for (var i = 0; i < m.length; i++) {
      var n = normaliserIsbn(m[i]);
      if (n) return n;
    }
    // ISBN écrit avec tirets dans une adresse : 978-2-340-04238-4
    var tirets = brut.match(/97[89][-\s0-9]{11,17}/g) || [];
    for (var j = 0; j < tirets.length; j++) {
      var t2 = normaliserIsbn(tirets[j]);
      if (t2) return t2;
    }
    return null;
  }

  // Retient le premier code de la liste dont on puisse tirer un ISBN.
  function extraireIsbn(codes) {
    for (var i = 0; i < codes.length; i++) {
      var n = isbnDansTexte(codes[i]);
      if (n) return n;
    }
    return null;
  }

  var scan = { flux: null, piste: null, lecteur: null, boucle: null,
               actif: false, minuteur: null, toile: null, lampe: false,
               journal: [], images: 0, vus: [] };

  // Impossible de reproduire les échecs de lecture à distance : le scanner
  // consigne donc ce qu'il fait, et l'élève peut nous transmettre le
  // relevé. Sans cela on corrige à l'aveugle.
  function noter(quoi) {
    scan.journal.push(quoi);
    if (scan.journal.length > 40) scan.journal.shift();
  }

  function releve() {
    var l = [];
    l.push("Appareil : " + navigator.userAgent);
    l.push("Décodeur natif : " + (("BarcodeDetector" in window) ? "oui" : "non (bibliothèque utilisée)"));
    l.push("Bibliothèque chargée : " + (window.ZXing ? "oui" : "non"));
    var v = document.getElementById("scanner-video");
    l.push("Vidéo : " + (v ? (v.videoWidth + "x" + v.videoHeight) : "absente"));
    if (scan.piste && scan.piste.getSettings) {
      var st = scan.piste.getSettings();
      l.push("Caméra : " + st.width + "x" + st.height + " · " + (st.facingMode || "?"));
    }
    l.push("Images analysées : " + scan.images);
    l.push("Codes vus : " + (scan.vus.length ? scan.vus.join(" | ") : "AUCUN"));
    l.push("Journal : " + scan.journal.join(" > "));
    return l.join("\n");
  }

  function texteScan(msg, detail) {
    var el = document.getElementById("scanner-texte");
    if (el) el.innerHTML = esc(msg) + (detail ? "<small>" + esc(detail) + "</small>" : "");
  }

  function fermerScanner() {
    scan.actif = false;
    if (scan.minuteur) { clearTimeout(scan.minuteur); scan.minuteur = null; }
    if (scan.boucle) { cancelAnimationFrame(scan.boucle); scan.boucle = null; }
    if (scan.lecteur) { try { scan.lecteur.reset(); } catch (e) {} scan.lecteur = null; }
    if (scan.piste && scan.lampe) {
      try { scan.piste.applyConstraints({ advanced: [{ torch: false }] }).catch(function () {}); } catch (e) {}
    }
    scan.lampe = false; scan.piste = null;
    var bl = document.getElementById("btn-lampe");
    if (bl) { bl.hidden = true; bl.textContent = "Lampe"; }
    if (scan.flux) { scan.flux.getTracks().forEach(function (t) { t.stop(); }); scan.flux = null; }
    var v = document.getElementById("scanner-video");
    if (v) v.srcObject = null;
    document.getElementById("scanner").hidden = true;
    document.body.style.overflow = "";
  }

  // Reçoit TOUS les codes vus sur l'image. Un code qui n'est pas un ISBN
  // — le code prix, un code produit — est ignoré en silence : afficher
  // une erreur à chaque image ferait clignoter un message d'échec alors
  // que le scan fonctionne.
  function codesLus(codes) {
    if (!scan.actif) return;
    for (var k = 0; k < codes.length; k++) {
      if (scan.vus.indexOf(codes[k]) === -1) scan.vus.push(codes[k]);
    }
    var isbn = extraireIsbn(codes);
    if (!isbn) return;   // codes non exploitables : consignés dans le relevé
    fermerScanner();
    var champ = document.getElementById("d-isbn");
    if (champ) champ.value = isbn;
    state.dernierIsbn = isbn;
    remplirDepuisIsbn(isbn);
  }

  // Chrome et Android savent lire un code-barres nativement. Safari non :
  // on ne charge la bibliothèque (330 ko) que dans ce cas, et seulement
  // au moment où l'élève appuie sur « Scanner ».
  function chargerZXing() {
    if (window.ZXing) return Promise.resolve();
    return new Promise(function (res, rej) {
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
      sc.onload = res;
      sc.onerror = function () { rej(new Error("bibliothèque indisponible")); };
      document.head.appendChild(sc);
    });
  }

  function ouvrirScanner() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("Cet appareil ne permet pas le scan. Saisissez l'ISBN à la main.");
      return;
    }
    var boite = document.getElementById("scanner");
    var video = document.getElementById("scanner-video");
    boite.hidden = false;
    document.body.style.overflow = "hidden";
    scan.actif = true;
    texteScan("Ouverture de la caméra…");

    scan.journal = []; scan.images = 0; scan.vus = [];
    var natif = "BarcodeDetector" in window;
    noter(natif ? "natif" : "bibliotheque");
    var demarrage = natif ? scanNatif(video) : chargerZXing().then(function () { return scanZXing(video); });

    demarrage.catch(function (e) {
      noter("ERREUR " + (e && (e.name || e.message)));
      var m = String(e && e.name);
      if (m === "NotAllowedError")     texteScan("Accès à la caméra refusé.", "Autorisez la caméra dans les réglages du navigateur, puis réessayez.");
      else if (m === "NotFoundError")  texteScan("Aucune caméra trouvée.", "Saisissez l'ISBN à la main.");
      else                             texteScan("Le scan en direct n'a pas pu démarrer.", "Utilisez « Photographier le code », ou saisissez l'ISBN à la main.");
    });
  }

  // Sur iPhone, le flux vidéo de Safari est souvent peu net et sa mise au
  // point mal maîtrisable. L'appareil photo natif, lui, produit une image
  // pleine résolution et parfaitement nette : on décode celle-là.
  function decoderImage(fichier) {
    texteScan("Lecture de la photo…");
    noter("photo " + Math.round(fichier.size / 1024) + "ko");
    var url = URL.createObjectURL(fichier);
    var img = new Image();

    img.onload = function () {
      var fini = function (codes) {
        URL.revokeObjectURL(url);
        noter("photo " + img.naturalWidth + "x" + img.naturalHeight +
              " codes:" + ((codes || []).length));
        for (var k = 0; k < (codes || []).length; k++) {
          if (scan.vus.indexOf(codes[k]) === -1) scan.vus.push(codes[k]);
        }
        var isbn = extraireIsbn(codes || []);
        if (isbn) { codesLus([isbn]); return; }
        texteScan("Code non reconnu sur cette photo.",
          "Cadrez le code-barres seul, bien à plat, sans reflet — ou saisissez l'ISBN à la main.");
      };

      if ("BarcodeDetector" in window) {
        new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "qr_code"] })
          .detect(img)
          .then(function (r) { fini((r || []).map(function (c) { return c.rawValue; })); })
          .catch(function () { fini([]); });
        return;
      }

      chargerZXing().then(function () {
        var Z = window.ZXing, indices = new Map();
        indices.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.QR_CODE]);
        indices.set(Z.DecodeHintType.TRY_HARDER, true);
        var lecteur = new Z.BrowserMultiFormatReader(indices);
        var essai;
        try { essai = lecteur.decodeFromImageElement(img); }
        catch (e) { essai = Promise.reject(e); }
        Promise.resolve(essai)
          .then(function (r) { fini(r ? [r.getText()] : []); })
          .catch(function () { fini([]); });
      }).catch(function () { fini([]); });
    };

    img.onerror = function () {
      URL.revokeObjectURL(url);
      texteScan("Image illisible.", "Réessayez, ou saisissez l'ISBN à la main.");
    };
    img.src = url;
  }

  function afficherReleve() {
    var boite = document.getElementById("releve");
    var texte = releve();
    boite.textContent = texte;
    boite.hidden = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte)
        .then(function () { toast("Relevé copié — collez-le dans la conversation."); })
        .catch(function () { toast("Relevé affiché : recopiez-le ou faites une capture."); });
    } else {
      toast("Relevé affiché : faites une capture d'écran.");
    }
  }

  function viserEtPatienter() {
    texteScan("Visez le code-barres ou le QR code.", "Au dos du livre. Le QR code, quand il y en a un, se lit plus facilement.");
    if (scan.minuteur) clearTimeout(scan.minuteur);
    // Au bout de dix secondes sans lecture, on aide au lieu de laisser
    // l'élève insister dans le vide.
    scan.minuteur = setTimeout(function () {
      if (scan.actif) texteScan("Toujours rien ?",
        "Inclinez le livre pour chasser le reflet, tenez-le à 15-20 cm bien à plat. Sinon : « Photographier le code », ou saisissez l'ISBN à la main. Le bouton Diagnostic indique ce que voit l'application.");
    }, 10000);
  }

  // La résolution par défaut d'une caméra web est souvent 640x480 :
  // beaucoup trop faible pour les barres serrées d'un EAN-13. On demande
  // du 1920 et une mise au point continue, sans quoi les couvertures
  // pelliculées restent floues.
  function ouvrirCamera(video) {
    return navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (flux) {
      scan.flux = flux;
      video.srcObject = flux;
      var piste = flux.getVideoTracks()[0];
      scan.piste = piste;

      // Réglages avancés : ils échouent silencieusement là où ils
      // n'existent pas, d'où le catch vide.
      try {
        piste.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function () {});
      } catch (e) {}

      var cap = piste.getCapabilities ? piste.getCapabilities() : {};
      if (cap && cap.torch) {
        var b = document.getElementById("btn-lampe");
        if (b) b.hidden = false;
      }
      noter("camera ouverte");
      return video.play().then(function () { noter("video en lecture"); });
    });
  }

  function basculerLampe() {
    if (!scan.piste) return;
    scan.lampe = !scan.lampe;
    scan.piste.applyConstraints({ advanced: [{ torch: scan.lampe }] })
      .then(function () {
        var b = document.getElementById("btn-lampe");
        if (b) b.textContent = scan.lampe ? "Éteindre" : "Lampe";
        if (scan.lampe) texteScan("Lampe allumée.",
          "Sur une couverture brillante, elle crée parfois un reflet : éteignez-la si la lecture ne vient pas.");
      })
      .catch(function () { toast("Cet appareil ne permet pas d'allumer la lampe."); });
  }

  // On ne décode que le contenu du cadre, agrandi : le décodeur reçoit
  // ainsi plus de pixels utiles et moins de décor.
  function imageDuViseur(video) {
    var vl = video.videoWidth, vh = video.videoHeight;
    if (!vl || !vh) return null;
    var lRel = 0.86, hRel = 0.34;              // proportions du cadre
    var sl = vl * lRel, sh = vh * hRel;
    var sx = (vl - sl) / 2, sy = (vh - sh) / 2;
    var c = scan.toile || (scan.toile = document.createElement("canvas"));
    c.width = Math.round(sl); c.height = Math.round(sh);
    c.getContext("2d", { willReadFrequently: true })
     .drawImage(video, sx, sy, sl, sh, 0, 0, c.width, c.height);
    return c;
  }

  function scanNatif(video) {
    // ean_13 encode l'ISBN ; ean_8 couvre quelques éditions anciennes.
    var detecteur = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "qr_code"] });
    return ouvrirCamera(video)
      .then(function () {
        viserEtPatienter();
        function tour() {
          if (!scan.actif) return;
          scan.images++;
          detecteur.detect(imageDuViseur(video) || video)
            .then(function (codes) {
              if (codes && codes.length) {
                codesLus(codes.map(function (c) { return c.rawValue; }));
              }
            })
            .catch(function () {})
            .then(function () { if (scan.actif) scan.boucle = requestAnimationFrame(tour); });
        }
        scan.boucle = requestAnimationFrame(tour);
      });
  }

  function scanZXing(video) {
    // Sans ces indications, le décodeur essaie tous les formats existants :
    // il est plus lent et se trompe davantage. On le restreint aux codes
    // de livre et on lui demande d'insister sur les images floues.
    var Z = window.ZXing, indices = new Map();
    indices.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.QR_CODE]);
    indices.set(Z.DecodeHintType.TRY_HARDER, true);
    scan.lecteur = new Z.BrowserMultiFormatReader(indices);
    // On ouvre nous-mêmes la caméra pour imposer la haute résolution et
    // la mise au point continue, puis on laisse le décodeur travailler
    // sur cet élément vidéo.
    return ouvrirCamera(video).then(function () {
      viserEtPatienter();
      var rappel = function (resultat) {
        scan.images++;
        if (resultat) { noter("code lu"); codesLus([resultat.getText()]); }
      };
      if (typeof scan.lecteur.decodeFromVideoElement === "function") {
        noter("decodeFromVideoElement");
        return scan.lecteur.decodeFromVideoElement(video, rappel);
      }
      noter("decodeFromVideoDevice");
      return scan.lecteur.decodeFromVideoDevice(null, video, rappel);
    });
  }

  /* ---------------- recherche du livre ---------------- */

  var MOTS_MATIERE = [
    // « analyse » seul est trop courant — « analyse critique » d'une œuvre
    // n'a rien de mathématique.
    [/math[eé]matiq|alg[eè]bre|g[eé]om[eé]trie|arithm[eé]tiq|\banalyse math/i, "Mathématiques"],
    [/physique|chimie/i, "Physique-Chimie"],
    [/\bsvt\b|biolog|g[eé]olog|sciences de la vie/i, "SVT"],
    [/histoire|g[eé]ograph/i, "Histoire-Géo"],
    [/\bses\b|[eé]conomi|sociolog/i, "SES"],
    [/philosoph/i, "Philosophie"],
    [/anglais|espagnol|allemand|italien|langue/i, "Langues"],
    [/\bnsi\b|informatique|num[eé]rique|python/i, "NSI"],
    [/fran[cç]ais|litt[eé]rature|po[eè]sie|th[eé][aâ]tre/i, "Français"]
  ];
  var MOTS_NIVEAU = [
    [/terminale|\bterm\b/i, "Terminale"],
    [/premi[eè]re|\b1re\b/i, "Première"],
    [/seconde|\b2de\b/i, "Seconde"],
    [/pr[eé]pa|sup\b|maths sup/i, "Prépa"]
  ];
  function deviner(regles, texte) {
    for (var i = 0; i < regles.length; i++) if (regles[i][0].test(texte)) return regles[i][1];
    return "";
  }

  // 1. La mémoire du lycée. Interrogée en premier : c'est la seule source
  //    qui connaisse le parascolaire français, et la seule qui réponde
  //    instantanément.
  function chercherFiche(isbn) {
    if (!state.sb) return Promise.resolve(null);
    return state.sb.from("fiches").select("*").eq("isbn", isbn).maybeSingle()
      .then(function (r) {
        if (r.error || !r.data) return null;
        var f = r.data;
        return {
          titre: f.titre, auteur: f.auteur || "",
          categorie: f.categorie || "", matiere: f.matiere || "", niveau: f.niveau || "",
          source: f.saisies > 1
            ? "renseigné par " + f.saisies + " élèves du lycée"
            : "renseigné par un élève du lycée"
        };
      })
      .catch(function () { return null; });
  }

  // 2. Le SUDOC, catalogue des bibliothèques universitaires françaises.
  //    C'est la source qui connaît l'édition parascolaire et de prépa —
  //    Ellipses, Vuibert, Dunod — que les catalogues internationaux
  //    ignorent. Deux appels : l'ISBN donne un numéro de notice, la
  //    notice donne la description.
  // Coupe sur un mot entier plutôt qu'au milieu : « Lionel Vid » n'aide
  // personne.
  function couper(t, n) {
    t = String(t || "").trim();
    if (t.length <= n) return t;
    var court = t.slice(0, n);
    var esp = court.lastIndexOf(" ");
    return (esp > n * 0.6 ? court.slice(0, esp) : court).replace(/[,;:\s]+$/, "") + "…";
  }

  // Le SUDOC écrit « Cédric Roux,... avec la collaboration de X,...Y ».
  // On garde le premier auteur et on jette l'appareil bibliographique.
  function nettoyerAuteur(t) {
    return String(t || "")
      .replace(/\s+/g, " ")
      .split(/\s*;\s*/)[0]
      .split(/\s*,?\s*avec (?:la collaboration|le concours|la participation)/i)[0]
      .replace(/^(par|sous la direction de|dir\.)\s+/i, "")
      .replace(/,\.\.\./g, "")
      .replace(/\.\.\./g, "")
      .replace(/[,;:.\s]+$/, "")
      .trim();
  }

  function chercherSudoc(isbn) {
    return fetch("https://www.sudoc.fr/services/isbn2ppn/" + isbn)
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (xml) {
        if (!xml) return null;
        var m = xml.match(/<ppn>([0-9Xx]+)<\/ppn>/);
        if (!m) return null;
        return fetch("https://www.sudoc.fr/" + m[1] + ".rdf")
          .then(function (r) { return r.ok ? r.text() : null; });
      })
      .then(function (rdf) {
        if (!rdf) return null;
        var doc = new DOMParser().parseFromString(rdf, "application/xml");
        var lire = function (tag) {
          var n = doc.getElementsByTagName(tag)[0];
          return n && n.textContent ? n.textContent.trim() : "";
        };
        var brut = lire("dc:title");
        if (!brut) return null;

        // Le SUDOC écrit « Titre : sous-titre / Auteur,... » avec des
        // espaces doublés : on sépare et on nettoie.
        var parts = brut.split(" / ");
        var titre = parts[0].replace(/\s+/g, " ").replace(/\s+:/g, " :").trim();
        var auteur = nettoyerAuteur(lire("dc:creator") || parts[1] || "");
        if (!auteur) {
          var ed = lire("dc:publisher");
          if (ed) auteur = ed.split(":").pop().split(",")[0].trim();
        }
        if (!titre) return null;
        return { titre: couper(titre, 90), auteur: couper(auteur, 60), source: "SUDOC" };
      })
      .catch(function () { return null; });
  }

  function chercherGoogle(isbn) {
    return fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.totalItems || !d.items) return null;
        var v = d.items[0].volumeInfo || {};
        if (!v.title) return null;
        return {
          titre: v.subtitle ? v.title + " — " + v.subtitle : v.title,
          auteur: (v.authors || []).join(", ") || v.publisher || "",
          source: "Google Books"
        };
      })
      .catch(function () { return null; });
  }

  function chercherOpenLibrary(isbn) {
    return fetch("https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var v = d && d["ISBN:" + isbn];
        if (!v || !v.title) return null;
        return {
          titre: v.title,
          auteur: (v.authors || []).map(function (a) { return a.name; }).join(", ") ||
                  (v.publishers || []).map(function (p) { return p.name; }).join(", ") || "",
          source: "Open Library"
        };
      })
      .catch(function () { return null; });
  }

  // La BnF n'indexe les ISBN qu'à dix chiffres pour une partie de ses
  // notices : on essaie les deux formes.
  function isbn13Vers10(c) {
    var noyau = c.slice(3, 12), somme = 0;
    for (var i = 0; i < 9; i++) somme += (+noyau[i]) * (10 - i);
    var cle = (11 - (somme % 11)) % 11;
    return noyau + (cle === 10 ? "X" : String(cle));
  }

  function interrogerBnf(code) {
    var url = "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve" +
              "&query=" + encodeURIComponent('bib.isbn all "' + code + '"') +
              "&recordSchema=dublincore&maximumRecords=1";
    return fetch(url)
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (xml) {
        if (!xml) return null;
        var doc = new DOMParser().parseFromString(xml, "application/xml");
        var lire = function (tag) {
          var n = doc.getElementsByTagName("dc:" + tag)[0];
          return n && n.textContent ? n.textContent.trim() : "";
        };
        var titre = lire("title");
        if (!titre) return null;
        return {
          titre: titre.replace(/\s*\/\s*.*$/, "").slice(0, 90),
          auteur: lire("creator") || lire("publisher") || "",
          source: "BnF"
        };
      })
      .catch(function () { return null; });
  }

  function chercherBnf(isbn) {
    return interrogerBnf(isbn).then(function (r) {
      if (r) return r;
      return /^978/.test(isbn) ? interrogerBnf(isbn13Vers10(isbn)) : null;
    });
  }

  // Le scan reste utile même quand aucun catalogue ne connaît le livre :
  // l'ISBN est rempli sans faute de frappe, et l'élève complète le reste.
  function remplirDepuisIsbn(isbn) {
    toast("ISBN " + isbn + " — recherche…");
    // La mémoire du lycée d'abord : instantanée, et seule à connaître
    // les manuels scolaires français.
    chercherFiche(isbn)
      .then(function (r) { return r || chercherSudoc(isbn); })
      .then(function (r) { return r || chercherGoogle(isbn); })
      .then(function (r) { return r || chercherOpenLibrary(isbn); })
      .then(function (r) { return r || chercherBnf(isbn); })
      .then(function (r) {
        var champ = function (id) { return document.getElementById(id); };
        if (!r) {
          toast("Livre inconnu : saisissez le titre. Il servira aux autres élèves.");
          if (champ("d-titre")) champ("d-titre").focus();
          return;
        }
        if (champ("d-titre") && !champ("d-titre").value)  champ("d-titre").value = r.titre;
        if (champ("d-auteur") && !champ("d-auteur").value) champ("d-auteur").value = r.auteur;

        var texte = r.titre + " " + r.auteur;
        var mat = r.matiere || deviner(MOTS_MATIERE, texte);
        var niv = r.niveau  || deviner(MOTS_NIVEAU, texte);
        if (mat && champ("d-mat")) champ("d-mat").value = mat;
        if (niv && champ("d-niv")) champ("d-niv").value = niv;
        if (champ("d-cat")) {
          champ("d-cat").value = r.categorie ||
            (/manuel|programme|bordas|nathan|hachette|magnard|hatier|belin|delagrave|ellipses|dunod|vuibert/i.test(texte)
              ? "manuel" : "lecture");
        }
        toast(r.titre.slice(0, 38) + " — " + r.source);
      });
  }


  /* ---------------- visionneuse ---------------- */

  function ouvrirPhoto(chemin) {
    var boite = document.getElementById("visionneuse");
    var img = document.getElementById("visionneuse-image");
    var attente = document.getElementById("visionneuse-attente");
    img.style.display = "none";
    attente.hidden = false;
    img.onload = function () { attente.hidden = true; img.style.display = ""; };
    img.onerror = function () { attente.textContent = "Photo indisponible."; };
    img.src = urlPhoto(chemin);   // la pleine résolution, chargée seulement ici
    boite.hidden = false;
    document.body.style.overflow = "hidden";
    document.querySelector("#visionneuse .fermer").focus();
  }

  function fermerPhoto() {
    var boite = document.getElementById("visionneuse");
    boite.hidden = true;
    document.getElementById("visionneuse-image").src = "";
    document.body.style.overflow = "";
  }

  document.getElementById("scanner").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-scan]");
    if (!b) return;
    var quoi = b.getAttribute("data-scan");
    if (quoi === "lampe") { basculerLampe(); return; }
    if (quoi === "photo") { var f = document.getElementById("isbn-photo"); if (f) f.click(); return; }
    if (quoi === "diagnostic") { afficherReleve(); return; }
    fermerScanner();
    if (quoi === "manuel") { var i = document.getElementById("d-isbn"); if (i) i.focus(); }
  });

  document.getElementById("isbn-photo").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (f) decoderImage(f);
  });

  document.getElementById("visionneuse").addEventListener("click", fermerPhoto);
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!document.getElementById("scanner").hidden) { fermerScanner(); return; }
    if (!document.getElementById("visionneuse").hidden) fermerPhoto();
  });

  /* ---------------- évènements ---------------- */

  document.getElementById("balance").addEventListener("click", function (ev) {
    if (ev.target.closest('[data-act="deconnexion"]')) deconnecter();
  });

  document.getElementById("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-tab]");
    if (!b) return;
    state.onglet = b.getAttribute("data-tab");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.getElementById("view").addEventListener("click", function (ev) {
    var seg = ev.target.closest("[data-mode]");
    if (seg) { state.filtre.mode = seg.getAttribute("data-mode"); render(); return; }

    var chip = ev.target.closest("[data-cat]");
    if (chip) { state.filtre.cat = chip.getAttribute("data-cat"); render(); return; }

    var sc = ev.target.closest("[data-scan]");
    if (sc) {
      var quoi = sc.getAttribute("data-scan");
      if (quoi === "ouvrir") ouvrirScanner();
      else if (quoi === "fermer") fermerScanner();
      else if (quoi === "manuel") { fermerScanner(); var i = document.getElementById("d-isbn"); if (i) i.focus(); }
      return;
    }

    var ag = ev.target.closest("[data-agrandir]");
    if (ag) { ouvrirPhoto(ag.getAttribute("data-agrandir")); return; }

    var cp = ev.target.closest("[data-compte]");
    if (cp) { state.modeCompte = cp.getAttribute("data-compte"); render(); return; }

    var ph = ev.target.closest("[data-photo]");
    if (ph) {
      if (ph.getAttribute("data-photo") === "retirer") { state.photo = null; render(); }
      else { var i = document.getElementById("d-photo"); if (i) i.click(); }
      return;
    }

    var dep = ev.target.closest("[data-depot]");
    if (dep) { state.depotMode = dep.getAttribute("data-depot"); render(); return; }

    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");
    if (act === "reserver") reserver(id);
    else if (act === "annuler") annuler(id);
    else if (act === "confirmer") confirmer(id);
    else if (act === "retirer") retirer(id);
    else if (act === "signaler") signaler(id);
    else if (act === "reset") { state.filtre = { q: "", mode: "", cat: "", niveau: "" }; render(); }
    else if (act === "aller-catalogue") { state.onglet = "catalogue"; render(); }
    else if (act === "aller-depot") { state.onglet = "deposer"; render(); }
    else if (act === "deconnexion") deconnecter();
  });

  /* ---------------- démarrage ---------------- */

  render();

  // Si le serveur est injoignable, l'application reste consultable avec
  // le jeu d'exemples plutôt que d'afficher une page vide.
  function replier(raison) {
    state.pret = false;
    state.horsLigne = raison || "serveur injoignable";
    state.membres = JSON.parse(JSON.stringify(EXEMPLES_MEMBRES));
    state.objets = EXEMPLES.slice();
    state.me = null;
    render();
  }

  function ecouterChangements() {
    state.sb.channel("casier")
      .on("postgres_changes", { event: "*", schema: "public", table: "objets" },
          function () { charger().catch(function () {}); })
      .on("postgres_changes", { event: "*", schema: "public", table: "membres" },
          function () { charger().catch(function () {}); })
      .subscribe();
  }

  function demarrer() {
    if (typeof supabase === "undefined" || !supabase.createClient) {
      replier("bibliothèque cliente non chargée");
      return;
    }
    state.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Connexion anonyme : chaque appareil reçoit une identité stable,
    // sans e-mail ni mot de passe. Elle sert à savoir qui dépose quoi.
    state.sb.auth.getSession()
      .then(function (r) {
        // Une session anonyme permet de consulter le catalogue avant de
        // s'inscrire ; déposer ou réserver demandera un vrai compte.
        if (r.data && r.data.session) return null;
        return state.sb.auth.signInAnonymously().then(function (a) {
          if (a.error) throw a.error;
          return null;
        });
      })
      .then(relireSession)
      .then(function (u) {
        if (!u) throw new Error("session absente");
        return charger();
      })
      .then(function () {
        state.pret = true;
        ecouterChangements();
        render();
      })
      .catch(function (e) { replier(messageErreur(e)); });
  }

  demarrer();
})();
</script>

<script>
  // Enregistre le service worker : rend l'application installable et
  // utilisable hors ligne. Sans lui, la page fonctionne normalement.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
