    return rpc("marquer_lu", { p_fil: id }).catch(function () {})
      .then(function () { return chargerMessages(id); })
      .then(chargerFils)
      .then(function () { render(); glisserEnBas(); });
  }

  function chargerMessages(filId) {
    return state.sb.from("messages").select("*").eq("fil", filId)
      .order("envoye_le", { ascending: true })
      .then(function (r) { state.messages = r.error ? [] : (r.data || []); });
  }

  function ouvrirDiscussion(objetId) {
    if (!state.me) { toast("Créez votre compte pour écrire."); return; }

    // Une conversation existante s'ouvre ; sinon on prépare seulement
    // l'écran. Créer le fil dès l'appui sur « Écrire » remplissait la
    // liste de conversations sans un seul message.
    var existant = null;
    for (var i = 0; i < state.fils.length; i++) {
      if (state.fils[i].objet === objetId) existant = state.fils[i].id;
    }

    fermerFiche();
    state.onglet = "messages";
    window.scrollTo(0, 0);

    if (existant) {
      state.filEnAttente = null;
      state.filOuvert = existant;
      ouvrirFil(existant);
    } else {
      state.filEnAttente = objetId;
      state.filOuvert = null;
      render();
    }
  }

  function envoyer(texte) {
    if (!texte.trim()) return;

    // C'est le premier message qui fait exister la conversation.
    if (!state.filOuvert && state.filEnAttente) {
      var objet = state.filEnAttente;
      rpc("ouvrir_fil", { p_objet: objet })
        .then(function (id) {
          state.filEnAttente = null;
          state.filOuvert = id;
          return rpc("envoyer_message", { p_fil: id, p_texte: texte });
        })
        .then(function () { return chargerMessages(state.filOuvert); })
        .then(chargerFils)
        .then(function () { render(); glisserEnBas(); })
        .catch(echec);
      return;
    }

    if (!state.filOuvert) return;
    rpc("envoyer_message", { p_fil: state.filOuvert, p_texte: texte })
      .then(function () { return chargerMessages(state.filOuvert); })
      .then(chargerFils)
      .then(function () { render(); glisserEnBas(); })
      .catch(echec);
  }

  function glisserEnBas() {
    var d = document.getElementById("discussion");
    if (d) d.scrollIntoView({ block: "end" });
  }

  /* ---------------- demandes ---------------- */

  function chargerRecherches() {
    if (!state.sb) return Promise.resolve();
    return state.sb.from("recherches").select("*").eq("active", true)
      .order("cree_le", { ascending: false })
      .then(function (r) { state.recherches = r.error ? [] : (r.data || []); })
      .catch(function () { state.recherches = []; });
  }

  function publierRecherche(champs) {
    rpc("publier_recherche", {
      p_titre: champs.titre, p_isbn: champs.isbn || null, p_categorie: champs.cat || null,
      p_matiere: champs.matiere || null, p_niveau: champs.niveau || null, p_note: champs.note || null
    }).then(chargerRecherches)
      .then(function () { render(); toast("Demande publiée. Les élèves qui l'ont la verront."); })
      .catch(echec);
  }

  function retirerRecherche(id) {
    rpc("retirer_recherche", { p_id: id }).then(chargerRecherches)
      .then(function () { render(); toast("Demande retirée."); })
      .catch(echec);
  }

  /* ---------------- actions ---------------- */

  var DOMAINE = "monlycee.net";

  // Passer à true le jour où un vrai service d'envoi est branché dans
  // Supabase. Tant que c'est false, « Mot de passe oublié ? » reste
  // caché : annoncer un lien qui n'arrive jamais est pire que de ne
  // rien proposer. Tout le reste du mécanisme est en place et testé.
  var SMTP_PRET = false;

  function estConnecte() { return !!(state.compte && !state.compte.anonyme); }

  var ERREURS_AUTH = [
    ["Inscription réservée", "Utilisez votre adresse @" + DOMAINE + " du lycée."],
    ["already registered",   "Cette adresse a déjà un compte. Choisissez « J'ai déjà un compte »."],
    ["User already",         "Cette adresse a déjà un compte. Choisissez « J'ai déjà un compte »."],
    ["Invalid login",        "Adresse ou mot de passe incorrect."],
    ["at least 6",           "Le mot de passe doit faire au moins 6 caractères."],
    ["Password should",      "Le mot de passe doit faire au moins 6 caractères."],
    ["Email rate limit",     "Trop de tentatives. Attendez quelques minutes."],
    // Sur la conversion d'un compte anonyme, Supabase masque l'exception
    // du déclencheur et renvoie ce message opaque. Dans notre base, la
    // seule cause possible est le domaine refusé.
    ["Error confirm email",  "Adresse refusée. Utilisez votre adresse @" + DOMAINE + " du lycée."]
  ];
  // Supabase fournit un code stable ; le texte anglais, lui, change d'une
  // version à l'autre. S'y fier avait laissé passer « already BEEN
  // registered », et l'élève ne voyait qu'un « opération non aboutie ».
  var CODES_AUTH = {
    email_exists:               "Cette adresse a déjà un compte.",
    user_already_exists:        "Cette adresse a déjà un compte.",
    invalid_credentials:        "Adresse ou mot de passe incorrect.",
    weak_password:              "Mot de passe trop court : 6 caractères minimum.",
    over_request_rate_limit:    "Trop de tentatives. Attendez une minute.",
    over_email_send_rate_limit: "Trop de tentatives. Attendez une minute.",
    email_address_invalid:      "Adresse invalide.",
    signup_disabled:            "Les inscriptions sont fermées."
  };
  function messageAuth(e) {
    if (e && e.code && CODES_AUTH[e.code]) return CODES_AUTH[e.code];
    var t = String((e && (e.message || e.error_description)) || "");
    for (var i = 0; i < ERREURS_AUTH.length; i++) {
      if (t.indexOf(ERREURS_AUTH[i][0]) !== -1) return ERREURS_AUTH[i][1];
    }
    return messageErreur(e);
  }

  function adresseDejaPrise(e) {
    return !!(e && (e.code === "email_exists" || e.code === "user_already_exists" ||
      /already .*registered|already exists/i.test(String(e.message || ""))));
  }

  function relireSession() {
    return state.sb.auth.getSession().then(function (r) {
      var u = r.data && r.data.session ? r.data.session.user : null;
      state.moiId = u ? u.id : null;
      state.compte = u ? { email: u.email || "", anonyme: !u.email } : null;
      return u;
    });
  }

  // Inscription. Si l'appareil a déjà une session anonyme, on la CONVERTIT
  // au lieu d'en créer une seconde : l'identifiant ne change pas, donc les
  // annonces et les crédits déjà accumulés sont conservés.
  function bonDomaine(email) {
    return String(email || "").toLowerCase().split("@")[1] === DOMAINE;
  }

  function inscrire(email, motdepasse, pseudo, classe) {
    if (state.occupe) return;
    // Contrôle immédiat, pour ne pas faire attendre un aller-retour réseau
    // sur une erreur évidente. La vraie barrière reste dans la base.
    if (!bonDomaine(email)) {
      toast("Inscription réservée aux élèves : utilisez votre adresse @" + DOMAINE + ".");
      return;
    }
    state.occupe = true; render();

    var suite;
    if (state.compte && state.compte.anonyme) {
      suite = state.sb.auth.updateUser({ email: email, password: motdepasse })
        .then(function (r) { if (r.error) throw r.error; });
    } else {
      suite = state.sb.auth.signUp({ email: email, password: motdepasse })
        .then(function (r) { if (r.error) throw r.error; });
    }

    suite
      .then(relireSession)
      .then(function () { return rpc("creer_membre", { p_pseudo: pseudo, p_classe: classe || "" }); })
      .then(charger)
      .then(function () {
        state.occupe = false; render();
        toast("Compte créé. Vous vous retrouverez sur tous vos appareils.");
      })
      .catch(function (e) {
        state.occupe = false;
        if (adresseDejaPrise(e)) {
          // Le compte existe : on amène l'élève là où il doit être plutôt
          // que de lui annoncer un échec et de le laisser recommencer.
          state.modeCompte = "connexion";
          render();
          var champ = document.getElementById("c-email");
          if (champ) { champ.value = email; champ.focus(); }
          var mdp = document.getElementById("c-mdp");
          if (mdp) mdp.focus();
          toast("Vous avez déjà un compte. Entrez votre mot de passe.");
          return;
        }
        render();
        toast(messageAuth(e));
      });
  }

  function connecter(email, motdepasse) {
    if (state.occupe) return;
    state.occupe = true; render();

    state.sb.auth.signInWithPassword({ email: email, password: motdepasse })
      .then(function (r) { if (r.error) throw r.error; })
      .then(relireSession)
      .then(charger)
      .then(function () {
        state.occupe = false;
        state.onglet = "catalogue";
        render();
        toast(state.me ? "Bonjour " + state.me.pseudo + "." : "Connexion réussie.");
      })
      .catch(function (e) {
        state.occupe = false; render();
        toast(messageAuth(e));
      });
  }

  // Un téléphone n'a pas de console : sans ce bouton, un élève coincé
  // par une session ou un cache abîmé n'a d'autre issue que de fouiller
  // les réglages de Safari. Il efface tout le stockage local du site,
  // jamais les données du serveur.
  function reinitialiser() {
    toast("Remise à zéro…");
    var taches = [];
    try { taches.push(state.sb ? state.sb.auth.signOut() : null); } catch (e) {}
    if (window.caches && caches.keys) {
      taches.push(caches.keys().then(function (n) {
        return Promise.all(n.map(function (x) { return caches.delete(x); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      taches.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    Promise.all(taches.map(function (t) { return Promise.resolve(t).catch(function () {}); }))
      .then(function () {
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        location.replace(location.pathname + "?n=" + Date.now());
      });
  }

  /* ---------------- notifications ---------------- */

  function base64VersOctets(b64) {
    var p = "=".repeat((4 - (b64.length % 4)) % 4);
    var brut = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/"));
    var t = new Uint8Array(brut.length);
    for (var i = 0; i < brut.length; i++) t[i] = brut.charCodeAt(i);
    return t;
  }

  function octetsVersBase64(buf) {
    var o = new Uint8Array(buf), s = "";
    for (var i = 0; i < o.length; i++) s += String.fromCharCode(o[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  // Sur iPhone, les notifications n'existent QUE pour une application
  // installée sur l'écran d'accueil : Safari ne les propose pas.
  function installee() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }

  function etatPush() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      return { possible: false, etat: "navigateur" };
    }
    if (!installee() && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
      return { possible: false, etat: "ios-non-installee" };
    }
    if (Notification.permission === "denied") return { possible: false, etat: "refuse" };
    return { possible: true, etat: Notification.permission };
  }

  // Le compteur rouge sur l'icône est un mécanisme distinct des
  // notifications : il ne vient pas du serveur, l'application le pose
  // elle-même. iOS ne l'accorde qu'à une application installée.
  function poserPastille() {
    var n = nonLus();
    try {
      if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
      else if (navigator.clearAppBadge) navigator.clearAppBadge();
    } catch (e) {}
  }

  // Vérifie que l'autorisation et l'affichage fonctionnent, sans faire
  // intervenir le serveur : si ceci s'affiche et qu'un vrai message ne
  // sonne pas, la panne est dans l'expédition, pas dans le téléphone.
  function essaiNotification() {
    if (Notification.permission !== "granted") {
      toast("Activez d'abord les notifications.");
      return;
    }
    navigator.serviceWorker.ready.then(function (reg) {
      return reg.showNotification("Le Casier — essai", {
        body: "Si vous lisez ceci, l'affichage fonctionne sur cet appareil.",
        icon: "./icones/icone-192.png",
        badge: "./icones/icone-192.png",
        tag: "essai"
      });
    }).then(function () {
      try { if (navigator.setAppBadge) navigator.setAppBadge(1); } catch (e) {}
      toast("Notification d'essai envoyée. Verrouillez l'écran pour la voir arriver.");
    }).catch(function () {
      toast("L'affichage a échoué sur cet appareil.");
    });
  }

  function rafraichirPush() {
    var e = etatPush();
    state.push.possible = e.possible;
    state.push.etat = e.etat;
    if (!e.possible) { state.push.actif = false; return Promise.resolve(); }
    return navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (ab) { state.push.actif = !!ab; })
      .catch(function () { state.push.actif = false; });
  }

  function activerPush() {
    if (!state.me) { toast("Créez votre compte pour être prévenue."); return; }
    // La demande d'autorisation DOIT partir d'un geste de l'utilisateur :
    // appelée au chargement, elle est refusée d'office par le navigateur.
    Notification.requestPermission()
      .then(function (perm) {
        if (perm !== "granted") throw new Error("permission " + perm);
        return navigator.serviceWorker.ready;
      })
      .then(function (reg) {
        return reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64VersOctets(CLE_PUSH)
        });
      })
      .then(function (ab) {
        var j = ab.toJSON ? ab.toJSON() : {};
        var cles = j.keys || {};
        return rpc("enregistrer_push", {
          p_endpoint: ab.endpoint,
          p_p256dh: cles.p256dh || octetsVersBase64(ab.getKey("p256dh")),
          p_auth:   cles.auth   || octetsVersBase64(ab.getKey("auth")),
          p_appareil: navigator.platform || ""
        });
      })
      .then(rafraichirPush)
      .then(function () { render(); toast("Notifications activées sur cet appareil."); })
      .catch(function (e) {
        rafraichirPush().then(render);
        toast(/denied|permission/.test(String(e && e.message))
          ? "Autorisation refusée. Réactivez-la dans les réglages du navigateur."
          : "Les notifications n'ont pas pu être activées.");
      });
  }

  function desactiverPush() {
    navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (ab) {
        if (!ab) return null;
        var url = ab.endpoint;
        return ab.unsubscribe().then(function () {
          return rpc("retirer_push", { p_endpoint: url }).catch(function () {});
        });
      })
      .then(rafraichirPush)
      .then(function () { render(); toast("Notifications désactivées sur cet appareil."); })
      .catch(function () { toast("La désactivation n'a pas abouti."); });
  }

  // Le service worker demande d'ouvrir un fil précis via ?fil=…
  function filDemande() {
    var m = location.search.match(/[?&]fil=([^&]+)/);
    if (!m) return null;
    history.replaceState(null, "", location.pathname);
    return decodeURIComponent(m[1]);
  }

  function deconnecter() {
    state.sb.auth.signOut()
      .then(function () {
        state.me = null; state.compte = null; state.moiId = null;
        return state.sb.auth.signInAnonymously();
      })
      .then(relireSession)
      .then(charger)
      .then(function () { toast("Déconnecté."); })
      .catch(function () { location.reload(); });
  }

  function creerCompte(pseudo, classe) {
    rpc("creer_membre", { p_pseudo: pseudo, p_classe: classe || "" })
      .then(charger)
      .then(function () { toast("Bienvenue " + pseudo + " — 2 crédits pour démarrer les échanges."); })
      .catch(function (e) {
        // Le compte a disparu du serveur entre-temps : on repart d'une
        // session propre plutôt que de boucler sur un formulaire mort.
        var t = String((e && e.message) || "");
        if (/violates foreign key|non connecté|JWT|not found/i.test(t)) {
          toast("Votre session n'est plus valide. Reconnectez-vous.");
          deconnecter();
          return;
        }
        echec(e);
      });
  }

  function deposer(o) {
    rpc("deposer_objet", {
      p_titre: o.titre, p_auteur: o.auteur, p_isbn: o.isbn,
      p_categorie: o.cat, p_matiere: o.matiere, p_niveau: o.niveau,
      p_etat: o.etat, p_note: o.note, p_mode: o.mode, p_prix: o.prix,
      p_photo: o.photo || null, p_photo_min: o.photoMin || null
    }).then(function () {
      state.photo = null;
      viderCoffre();
      state.brouillon = {};
      try { sessionStorage.removeItem("casier-brouillon"); } catch (e) {}
      state.onglet = "catalogue";
      // La saisie de cet élève devient la fiche du lycée pour cet ISBN :
      // les suivants n'auront plus à la refaire.
      if (o.isbn && /^([0-9]{8}|[0-9]{13})$/.test(o.isbn) && o.titre) {
        var f = (state.ficheTrouvee && state.dernierIsbn === o.isbn) ? state.ficheTrouvee : {};
        rpc("enregistrer_fiche", {
          p_code: o.isbn, p_titre: o.titre, p_auteur: o.auteur || "",
          p_categorie: o.cat || "", p_matiere: o.matiere || "", p_niveau: o.niveau || "",
          p_editeur: f.editeur || null, p_annee: f.annee || null,
          p_pages: f.pages || null, p_resume: f.resume || null,
          p_couverture: f.couverture || null
        }).catch(function () {});   // sans conséquence si l'enregistrement échoue
      }
      return charger();
    }).then(function () {
      if (o.mode === "troc")     toast("Annonce publiée. +1 crédit.");
      else if (o.mode === "don") toast("Don publié. Merci — ça fait vivre le service.");
      else toast("Annonce publiée à " + prixFmt(o.prix) + ". Le règlement se fait en main propre.");
    }).catch(echec);
  }

  function trouver(id) {
    for (var i = 0; i < state.objets.length; i++) if (state.objets[i].id === id) return state.objets[i];
    return null;
  }

  function reserver(id) {
    var o = trouver(id);
    rpc("reserver_objet", { p_objet: id }).then(charger).then(function () {
      if (!o) return;
      if (o.mode === "troc")     toast("Réservé — 1 crédit débité. Retrait au CDI.");
      else if (o.mode === "don") toast("Réservé. Contactez " + o.proprietaire + " pour le retrait au CDI.");
      else toast("Réservé à " + prixFmt(o.prix) + ". Paiement en main propre, l'application n'encaisse rien.");
    }).catch(echec);
  }

  function annuler(id) {
    var o = trouver(id);
    rpc("annuler_reservation", { p_objet: id }).then(charger).then(function () {
      toast(o && o.mode === "troc" ? "Réservation annulée. Crédit rendu." : "Réservation annulée.");
    }).catch(echec);
  }

  function mesDemandes() {
    if (!state.me) return 0;
    var n = 0;
    for (var i = 0; i < state.recherches.length; i++) {
      if (state.recherches[i].demandeur === state.me.cle) n++;
    }
    return n;
  }

  function confirmer(id) {
    var o = trouver(id);
    var avant = mesDemandes();
    rpc("confirmer_echange", { p_objet: id }).then(charger).then(function () {
      // Une demande retirée sans le dire donnerait l'impression d'une
      // disparition : on l'annonce, c'est une conséquence de son geste.
      var retirees = avant - mesDemandes();
      if (retirees > 0) {
        toast(retirees > 1
          ? "Échange confirmé. Vos " + retirees + " demandes correspondantes ont été retirées."
          : "Échange confirmé. Votre demande correspondante a été retirée.");
      } else if (o && o.mode === "don") {
        toast("C'est noté. Un don de plus au compteur de " + o.proprietaire + ".");
      } else {
        toast("Échange confirmé.");
      }
    }).catch(echec);
  }

  function retirer(id) {
    var o = trouver(id);
    // La photo part en premier : le stockage n'accepte cette suppression
    // que de son propriétaire, et l'annonce en porte seule le chemin.
    var fichiers = [];
    if (o && o.photo) fichiers.push(o.photo);
    if (o && o.photoMin) fichiers.push(o.photoMin);
    var prealable = fichiers.length
      ? state.sb.storage.from("photos").remove(fichiers).catch(function () {})
      : Promise.resolve();

    prealable
      .then(function () { return rpc("retirer_objet", { p_objet: id }); })
      .then(charger)
      .then(function () { toast("Annonce retirée."); })
      .catch(echec);
  }

  var MOTIFS = [
    ["inapproprie", "Contenu déplacé ou blessant"],
    ["interdit",    "Objet qui n'a rien à faire au lycée"],
    ["prix",        "Prix abusif"],
    ["faux",        "Annonce fausse ou trompeuse"],
    ["autre",       "Autre raison"]
  ];

  // Signaler ne part plus au premier clic : masquer l'annonce d'un
  // camarade mérite qu'on dise pourquoi, et le motif est ce qui permet
  // au référent de trancher sans rouvrir toute l'histoire.
  function signaler(id) {
    state.signalementPour = id;
    if (state.fiche === id) renderFiche(); else ouvrirFiche(id);
  }

  function annulerSignalement() {
    state.signalementPour = null;
    renderFiche();
  }

  function envoyerSignalement(id, motif) {
    var zone = document.getElementById("sig-precisions");
    var precisions = zone ? zone.value : "";
    state.signalementPour = null;
    rpc("signaler_objet", { p_objet: id, p_motif: motif, p_precisions: precisions })
      .then(function (issue) {
        return charger().then(function () {
          fermerFiche();
          toast(issue === "deja_verifiee"
            ? "Signalement transmis. Un adulte avait déjà vérifié cette annonce, elle reste visible."
            : "Signalé. L'annonce est masquée le temps qu'un adulte la vérifie.");
        });
      })
      .catch(function (e) { renderFiche(); echec(e); });
  }

  /* ---------------- rendu ---------------- */

  function renderBalance() {
    var el = document.getElementById("balance");
    if (!state.me) { el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "";
    var m = moiMembre() || { credits: 0, dons: 0 };
    el.innerHTML =
      '<div class="who"><b>' + esc(state.me.pseudo) + "</b><span>" + esc(state.me.classe || "—") +
        (estConnecte() ? ' <button class="deconnexion" data-act="deconnexion">quitter</button>' : "") +
        "</span></div>" +
      ((m.dons || 0) > 0 ? '<div class="dons" title="Objets donnés"><b>' + m.dons + "</b><span>dons</span></div>" : "") +
      '<div class="credits"><b>' + (m.credits || 0) + "</b><span>crédits</span></div>";
  }

  function renderOnboard() {
    var el = document.getElementById("onboard");

    // Le retour depuis un lien de réinitialisation passe avant tout :
    // à ce moment la session est déjà ouverte, donc `state.me` est
    // renseigné et les gardes ci-dessous masqueraient le formulaire.
    if (state.recuperation) {
      el.innerHTML = formulaireNouveauMdp();
      document.getElementById("f-nouveau-mdp").addEventListener("submit", function (ev) {
        ev.preventDefault();
        changerMotDePasse(document.getElementById("n-mdp").value);
      });
      return;
    }

    // Trois situations : pas encore de compte, compte sans pseudo, ou tout est en place.
    if (state.me) { el.innerHTML = ""; return; }
    if (!state.sb || !state.compte) { el.innerHTML = ""; return; }

    if (estConnecte()) {
      // Sans cette garde, un chargement raté faisait croire à un compte
      // sans profil, et l'application redemandait un pseudo à chaque
      // ouverture alors que le profil existait bel et bien.
      if (!state.pret) { el.innerHTML = ""; return; }
      el.innerHTML = formulairePseudo();
      brancherPseudo();
      return;
    }

    if (state.modeCompte === "oubli") {
      el.innerHTML = formulaireOubli();
      document.getElementById("f-oubli").addEventListener("submit", function (ev) {
        ev.preventDefault();
        demanderReinitialisation(document.getElementById("o-email").value.trim().toLowerCase());
      });
      return;
    }

    var inscription = state.modeCompte === "inscription";
    el.innerHTML =
      '<div class="onboard">' +
        '<div class="compte-bascule" role="group">' +
          '<button data-compte="inscription" aria-pressed="' + inscription + '">Créer mon compte</button>' +
          '<button data-compte="connexion" aria-pressed="' + (!inscription) + '">J\'ai déjà un compte</button>' +
        "</div>" +
        (inscription
          ? "<h2>Créer votre compte</h2><p>Réservé aux élèves du lycée : votre adresse " +
            '<span class="domaine">@' + DOMAINE + "</span>. " +
            "Un seul compte, que vous retrouverez sur le téléphone comme sur les ordinateurs du CDI. " +
            "Votre adresse ne s'affiche nulle part dans l'application — les autres élèves ne voient que votre pseudo.</p>"
          : "<h2>Se connecter</h2><p>Retrouvez votre pseudo, vos crédits et vos annonces, " +
            "sur n'importe quel appareil.</p>") +
        '<form id="f-compte">' +
          '<div class="compte-champs">' +
            '<div class="full"><label for="c-email">Adresse du lycée</label>' +
              '<input id="c-email" type="email" required autocomplete="email" ' +
              'placeholder="prenom.nom@' + DOMAINE + '"></div>' +
            '<div><label for="c-mdp">Mot de passe</label>' +
              '<input id="c-mdp" type="password" required minlength="6" ' +
              'autocomplete="' + (inscription ? "new-password" : "current-password") + '" ' +
              'placeholder="6 caractères minimum"></div>' +
            (inscription
              ? '<div><label for="c-pseudo">Pseudo</label>' +
                  '<input id="c-pseudo" required maxlength="20" placeholder="Nawel" autocomplete="off"></div>' +
                '<div><label for="c-classe">Classe</label>' +
                  '<input id="c-classe" maxlength="12" placeholder="1re G2" autocomplete="off"></div>'
              : "") +
          "</div>" +
          '<div style="margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
            '<button class="btn primary" type="submit"' + (state.occupe ? " disabled" : "") + ">" +
              (state.occupe ? "Un instant…" : (inscription ? "Créer mon compte" : "Se connecter")) +
            "</button>" +
            (inscription || !SMTP_PRET ? ""
              : '<button type="button" class="deconnexion" data-compte="oubli">Mot de passe oublié ?</button>') +
            '<button type="button" class="deconnexion" data-act="reinitialiser">Un problème ? Remettre à zéro</button>' +
          "</div>" +
        "</form>" +
      "</div>";

    document.getElementById("f-compte").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var email = document.getElementById("c-email").value.trim().toLowerCase();
      var mdp = document.getElementById("c-mdp").value;
      if (state.modeCompte === "inscription") {
        var pseudo = document.getElementById("c-pseudo").value.trim();
        if (!pseudo) return;
        inscrire(email, mdp, pseudo, document.getElementById("c-classe").value.trim());
      } else {
        connecter(email, mdp);
      }
    });
  }

  /* ---------------- mot de passe oublié ---------------- */

  function formulaireOubli() {
    return '<div class="onboard">' +
      '<div class="compte-bascule" role="group">' +
        '<button data-compte="inscription" aria-pressed="false">Créer mon compte</button>' +
        '<button data-compte="connexion" aria-pressed="false">J\'ai déjà un compte</button>' +
      "</div>" +
      "<h2>Mot de passe oublié</h2>" +
      "<p>Indiquez votre adresse du lycée : un lien y sera envoyé pour en choisir un nouveau. " +
      "Vos annonces, vos crédits et vos messages ne bougent pas.</p>" +
      '<form id="f-oubli">' +
        '<div class="compte-champs">' +
          '<div class="full"><label for="o-email">Adresse du lycée</label>' +
            '<input id="o-email" type="email" required autocomplete="email" ' +
            'placeholder="prenom.nom@' + DOMAINE + '"></div>' +
        "</div>" +
        '<div style="margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
          '<button class="btn primary" type="submit"' + (state.occupe ? " disabled" : "") + ">" +
            (state.occupe ? "Un instant…" : "Envoyer le lien") + "</button>" +
          '<button type="button" class="deconnexion" data-compte="connexion">Revenir à la connexion</button>' +
        "</div>" +
      "</form>" +
    "</div>";
  }

  function demanderReinitialisation(email) {
    if (state.occupe) return;
    if (!bonDomaine(email)) {
      toast("Utilisez votre adresse @" + DOMAINE + ".");
      return;
    }
    state.occupe = true; render();

    // L'adresse de retour doit figurer dans Supabase (Authentication >
    // URL Configuration), sinon le lien renvoie ailleurs et le jeton
    // est perdu.
    state.sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    })
      .then(function (r) { if (r && r.error) throw r.error; })
      .then(function () {
        state.occupe = false;
        state.modeCompte = "connexion";
        render();
        // On ne dit jamais si l'adresse est connue : sinon n'importe qui
        // pourrait savoir quels élèves ont un compte.
        toast("Si un compte existe pour cette adresse, un lien vient d'y être envoyé.");
      })
      .catch(function (e) { state.occupe = false; render(); echec(e); });
  }

  function formulaireNouveauMdp() {
    return '<div class="onboard">' +
      "<h2>Choisir un nouveau mot de passe</h2>" +
      "<p>Le lien que vous venez d'ouvrir prouve que cette adresse est la vôtre. " +
      "Le nouveau mot de passe remplacera l'ancien immédiatement.</p>" +
      '<form id="f-nouveau-mdp">' +
        '<div class="compte-champs">' +
          '<div class="full"><label for="n-mdp">Nouveau mot de passe</label>' +
            '<input id="n-mdp" type="password" required minlength="6" ' +
            'autocomplete="new-password" placeholder="6 caractères minimum"></div>' +
        "</div>" +
        '<div style="margin-top:16px">' +
          '<button class="btn primary" type="submit"' + (state.occupe ? " disabled" : "") + ">" +
            (state.occupe ? "Un instant…" : "Enregistrer") + "</button>" +
        "</div>" +
      "</form>" +
    "</div>";
  }

  function changerMotDePasse(mdp) {
    if (state.occupe) return;
    state.occupe = true; render();
    state.sb.auth.updateUser({ password: mdp })
      .then(function (r) { if (r && r.error) throw r.error; })
      .then(relireSession)
      .then(charger)
      .then(function () {
        state.occupe = false;
        state.recuperation = false;
        // Le jeton reste dans l'adresse tant qu'on ne l'efface pas : sans
        // cela, un rechargement rouvrirait ce formulaire indéfiniment.
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
        render();
        toast("Mot de passe changé. Votre session est ouverte.");
      })
      .catch(function (e) { state.occupe = false; render(); echec(e); });
  }

  // Cas rare : le compte existe mais le pseudo n'a pas été enregistré.
  function formulairePseudo() {
    return '<div class="onboard">' +
      "<h2>Il ne manque que votre pseudo</h2>" +
      "<p>Votre compte est créé. Choisissez le nom sous lequel les autres élèves vous verront — " +
      "pas votre nom de famille.</p>" +
      '<form class="row" id="f-pseudo">' +
        '<div><label for="p-pseudo">Pseudo</label>' +
          '<input id="p-pseudo" required maxlength="20" placeholder="Nawel" autocomplete="off"></div>' +
        '<div><label for="p-classe">Classe</label>' +
          '<input id="p-classe" maxlength="12" placeholder="1re G2" autocomplete="off"></div>' +
        '<button class="btn primary" type="submit">Valider</button>' +
      "</form>" +
      '<p style="margin:14px 0 0;font-size:13px;color:var(--muted)">Ce n\'est pas vous ? ' +
        '<button class="deconnexion" data-act="deconnexion">Se déconnecter</button></p>' +
    "</div>";
  }

  function brancherPseudo() {
    var f = document.getElementById("f-pseudo");
    if (!f) return;
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = document.getElementById("p-pseudo").value.trim();
      if (!p) return;
      creerCompte(p, document.getElementById("p-classe").value.trim());
    });
  }

  function estActif(o) { return o.statut !== "echange" && !o.signale; }

  var ICONES = {
    catalogue: '<path d="M3 9.5 12 4l9 5.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9.5 20v-5.5h5V20"/>',
    recherches:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
    deposer:   '<circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/>',
    messages:  '<path d="M4 5.5h16v11H9l-5 3.5v-3.5H4z"/>',
    moi:       '<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/>',
    moderation:'<path d="M12 3.2 19 6v5.6c0 4-2.8 7.3-7 8.8-4.2-1.5-7-4.8-7-8.8V6z"/><path d="M9.2 12l2 2 3.6-3.8"/>'
  };

  // Un fil est « à voir » quand son dernier message n'est pas de moi ET
  // qu'il est postérieur à ma dernière ouverture. Sans cette seconde
  // condition, lire ne suffisait pas : il fallait répondre.
  function aVoir(f) {
    if (!state.me || !f.dernierAuteur) return false;
    if (f.dernierAuteur === state.me.cle) return false;
    var lu = (f.proprietaire === state.me.cle) ? f.lu_proprietaire : f.lu_demandeur;
    if (!lu) return true;
    return new Date(f.maj).getTime() > new Date(lu).getTime();
  }

  function nonLus() {
    var n = 0;
    for (var i = 0; i < state.fils.length; i++) if (aVoir(state.fils[i])) n++;
    return n;
  }

  function renderNav() {
    var defs = [
      { id: "catalogue",  nom: "Catalogue" },
      { id: "deposer",    nom: "Déposer", plus: true },
      { id: "messages",   nom: "Messages", badge: nonLus() }
    ];
    // L'onglet n'existe que pour l'adulte référent.
    if (state.referent) defs.push({ id: "moderation", nom: "Modérer", badge: aTraiter() });
    defs.push({ id: "moi", nom: "Moi" });
    var html = "";
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      html += '<button role="tab" data-onglet="' + d.id + '" aria-selected="' +
        (state.onglet === d.id) + '"' + (d.plus ? ' class="plus"' : "") +
        ' aria-label="' + d.nom + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONES[d.id] + "</svg>" +
        "<span>" + d.nom + "</span>" +
        (d.badge ? '<i class="pastille">' + d.badge + "</i>" : "") +
        "</button>";
    }
    document.getElementById("nav").innerHTML = html;
  }

  function estAMoi(o) {
    if (!state.me) return false;
    return o.proprietaireCle === state.me.cle || o.reserveParCle === state.me.cle;
  }

  function badgeMode(o) {
    if (o.mode === "don") return '<span class="mode don">Gratuit · don</span>';
    if (o.mode === "vente") {
      return '<span class="mode vente"><b>' + prixFmt(o.prix) + "</b><span>en main propre</span></span>";
    }
    return '<span class="mode troc">Troc · 1 crédit</span>';
  }

  function valeurCourte(o) {
    if (o.mode === "don")   return '<span class="gratuit">Gratuit</span>';
    if (o.mode === "vente") return '<span class="prix">' + prixFmt(o.prix) + "</span>";
    return '<span class="troc">1 crédit</span>';
  }

  // À défaut de photo prise par l'élève, la couverture fournie par le
  // catalogue vaut mieux qu'un aplat de couleur.
  function illustration(o) {
    if (o.photo) return urlPhoto(o.photoMin || o.photo);
    var f = fichePour(o);
    return (f && f.couverture) || "";
  }

  // « Auteur · année » : de quoi distinguer deux éditions du même manuel,
  // ce que le titre seul ne permet pas.
  function signature(o) {
    var f = fichePour(o) || {};
    var a = o.auteur || f.auteur || "";
    var an = f.annee ? String(f.annee) : "";
    return [couper(a, 34), an].filter(Boolean).join(" · ");
  }

  // La carte ne porte que ce qui décide d'un clic : la photo, le prix ou
  // le mode, le titre. Tout le reste attend la fiche détaillée.
  function carte(o) {
    var couleur = sw(o.cat);
    var cls = (o.signale || o.statut === "echange") ? " gone" : "";

    var pill = "";
    if (o.signale)                  pill = '<span class="pill signale pastille-statut">Signalé</span>';
    else if (o.statut === "echange")pill = '<span class="pill echange pastille-statut">Terminé</span>';
    else if (o.statut === "reserve")pill = '<span class="pill reserve pastille-statut">Réservé</span>';

    return (
      '<article class="obj' + cls + '" style="--sw:' + couleur + '" data-ouvrir="' + o.id + '" tabindex="0">' +
        '<div class="vignette">' +
          '<span class="repli">' + esc(catNom(o.cat)) + "</span>" +
          (illustration(o)
            ? '<img src="' + esc(illustration(o)) + '" alt="" loading="lazy" ' +
              'decoding="async" onerror="this.remove()">'
            : "") +
          pill +
        "</div>" +
        '<div class="obj-corps">' +
          valeurCourte(o) +
          "<h3>" + esc(o.titre) + "</h3>" +
          (signature(o) ? '<span class="sous auteur-carte">' + esc(signature(o)) + "</span>" : "") +
          '<span class="sous">' + esc(o.etat || catNom(o.cat)) + "</span>" +
        "</div>" +
      "</article>"
    );
  }

  /* ---------------- fiche détaillée ---------------- */

  function ligne(cle, valeur) {
    return valeur ? "<div><dt>" + esc(cle) + "</dt><dd>" + esc(valeur) + "</dd></div>" : "";
  }

  function valeurLongue(o) {
    if (o.mode === "don")
      return '<span class="libre">Gratuit</span><small>don, sans contrepartie</small>';
    if (o.mode === "vente")
      return "<b>" + prixFmt(o.prix) + "</b><small>réglé en main propre, l'application n'encaisse rien</small>";
    return '<span class="echange">1 crédit</span><small>échange</small>';
  }

  function ouvrirFiche(id) {
    // L'annonce peut avoir disparu entre l'affichage de la carte et le clic :
    // le catalogue se met à jour en direct, et un référent vient peut-être de
    // la supprimer. Sans ce contrôle, la fiche s'ouvrait vide.
    if (!trouver(id)) { toast("Cette annonce n'existe plus."); return; }
    state.fiche = id;
    renderFiche();
    document.getElementById("fiche").hidden = false;
    document.getElementById("fiche").scrollTop = 0;
    document.body.style.overflow = "hidden";
  }

  function fermerFiche() {
    state.fiche = null;
    state.signalementPour = null;
    document.getElementById("fiche").hidden = true;
    document.body.style.overflow = "";
  }

  function renderFiche() {
    if (!state.fiche) return;
    var o = trouver(state.fiche);
    if (!o) { fermerFiche(); return; }

    var suisProprio = state.me && o.proprietaireCle === state.me.cle;
    var suisPreneur = state.me && o.reserveParCle === state.me.cle;

    var actions = "";
    if (!state.me) {
      actions = '<p class="note" style="margin:0">Créez votre compte pour réserver ou écrire au vendeur.</p>';
    } else if (o.signale) {
      actions = '<p class="note" style="margin:0">Annonce signalée, en attente de vérification.</p>';
    } else if (suisProprio) {
      actions = (o.statut === "dispo"
        ? '<button class="btn ghost" data-act="retirer" data-id="' + o.id + '">Retirer l\'annonce</button>'
        : '<button class="btn ghost" disabled>Réservé par ' + esc(o.reservePar || "…") + "</button>");
    } else if (o.statut === "dispo") {
      var libelle = o.mode === "don" ? "Je le prends"
                  : o.mode === "vente" ? "Ça m'intéresse" : "Réserver · 1 crédit";
      actions =
        '<button class="btn ' + (o.mode === "don" ? "give" : "primary") + '" data-act="reserver" data-id="' + o.id + '">' + libelle + "</button>" +
        '<button class="btn ghost" data-act="ecrire" data-id="' + o.id + '">Écrire à ' + esc(o.proprietaire) + "</button>";
    } else if (suisPreneur) {
      actions =
        '<button class="btn primary" data-act="confirmer" data-id="' + o.id + '">C\'est récupéré</button>' +
        '<button class="btn ghost" data-act="ecrire" data-id="' + o.id + '">Discuter du rendez-vous</button>' +
        '<button class="btn ghost" data-act="annuler" data-id="' + o.id + '">Annuler</button>';
    } else {
      actions = '<button class="btn ghost" disabled>Déjà réservé</button>';
    }

    var fiche = fichePour(o) || {};
    document.getElementById("fiche-titre-barre").textContent = o.titre;
    document.getElementById("fiche-corps").innerHTML =
      '<div class="fiche-photo" style="--sw:' + sw(o.cat) + '"' +
        (o.photo ? ' data-agrandir="' + esc(o.photo) + '"' : "") + ">" +
        '<span class="repli">' + esc(catNom(o.cat)) + "</span>" +
        ((o.photo || fiche.couverture)
          ? '<img src="' + esc(o.photo ? urlPhoto(o.photo) : fiche.couverture) +
            '" alt="Photo de ' + esc(o.titre) + '" onerror="this.remove()">'
          : "") +
      "</div>" +
      "<h1>" + esc(o.titre) + "</h1>" +
      ((o.auteur || fiche.auteur) ? '<p class="auteur">' + esc(o.auteur || fiche.auteur) + "</p>" : "") +
      '<div class="valeur">' + valeurLongue(o) + "</div>" +
      (o.note ? '<p class="note">' + esc(o.note) + "</p>" : "") +
      (fiche.resume
        ? '<details class="resume"><summary>Résumé</summary><p>' + esc(fiche.resume) + "</p>" +
          '<span class="prov">Source : catalogue, d\'après l\'ISBN</span></details>'
        : "") +
      '<div class="fiche-actions">' + actions + "</div>" +
      (o.mode === "vente" && !suisProprio
        ? '<p class="rappel-rdv">Le règlement se fait de la main à la main, au CDI. ' +
          "L'application n'encaisse rien et ne garantit aucune transaction.</p>"
        : "") +
      '<dl class="lignes">' +
        ligne("Déposé par", o.proprietaire + (o.classe ? " · " + o.classe : "")) +
        ligne("Catégorie", catNom(o.cat)) +
        ligne("Matière", o.matiere) +
        ligne("Niveau", o.niveau) +
        ligne("État", o.etat) +
        ligne("Éditeur", fiche.editeur) +
        ligne("Année", fiche.annee ? String(fiche.annee) : "") +
        ligne("Pages", fiche.pages ? fiche.pages + " p." : "") +
        ligne("ISBN", o.isbn) +
        ligne("Retrait", "Au CDI") +
      "</dl>" +
      blocSignalement(o, suisProprio);
  }

  function blocSignalement(o, suisProprio) {
    if (!state.me || suisProprio || o.signale) return "";
    if (state.signalementPour !== o.id) {
      return '<button class="btn ghost" data-act="signaler" data-id="' + o.id + '" ' +
             'style="width:100%;color:var(--faint)">Signaler cette annonce</button>';
    }
    var choix = "";
    for (var i = 0; i < MOTIFS.length; i++) {
      choix += '<button class="btn ghost motif" data-act="signaler-motif" data-id="' + o.id +
               '" data-motif="' + MOTIFS[i][0] + '">' + esc(MOTIFS[i][1]) + "</button>";
    }
    return '<div class="signalement">' +
      "<h3>Pourquoi signalez-vous cette annonce ?</h3>" +
      '<p class="sub">L\'annonce sera masquée le temps qu\'un adulte du lycée la vérifie. ' +
      "Votre pseudo n'est montré ni à l'élève concerné, ni aux autres.</p>" +
      '<textarea id="sig-precisions" rows="2" maxlength="300" ' +
      'placeholder="Précisions, si besoin (facultatif)"></textarea>' +
      choix +
      '<button class="btn ghost annuler-sig" data-act="signaler-annuler">Annuler</button>' +
      "</div>";
  }

  // Les demandes se filtrent comme les annonces : une recherche sur
  // « SES » doit trouver aussi bien ce qu'on offre que ce qu'on réclame.
  function filtrerDemandes() {
    if (state.filtre.mode === "gratuit" || state.filtre.mode === "vente") return [];
    var q = state.filtre.q.toLowerCase().trim();
    return state.recherches.filter(function (r) {
      if (state.filtre.cat && r.categorie !== state.filtre.cat) return false;
      if (state.filtre.niveau && r.niveau !== state.filtre.niveau) return false;
      if (q) {
        var foin = (r.titre + " " + (r.matiere || "") + " " + (r.note || "") + " " +
                    catNom(r.categorie)).toLowerCase();
        if (foin.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Une demande n'a ni photo ni prix : lui donner l'allure d'une annonce
  // ferait croire à un objet disponible. Le cadre en pointillés dit
  // qu'il s'agit d'un manque, pas d'une offre.
  function carteDemande(r) {
    var dem = state.membres[r.demandeur] || {};
    var mien = state.me && r.demandeur === state.me.cle;
    return (
      '<article class="obj demande" style="--sw:' + sw(r.categorie || "autre") + '">' +
        '<div class="vignette creux">' +
          '<span class="etiquette">Recherché</span>' +
          "<span class=\"repli\">" + esc(catNom(r.categorie)) + "</span>" +
        "</div>" +
        '<div class="obj-corps">' +
          '<span class="cherche">Recherché</span>' +
          "<h3>" + esc(r.titre) + "</h3>" +
          '<span class="sous">' + esc([r.matiere, r.niveau].filter(Boolean).join(" · ") ||
            ("par " + (dem.pseudo || "un élève"))) + "</span>" +
          (mien
            ? '<button class="btn ghost" data-retirer-recherche="' + r.id + '" ' +
              'style="margin-top:7px;font-size:12px;padding:6px 10px">Retirer ma demande</button>'
            : '<button class="btn ghost" data-act="aller-depot" ' +
              'style="margin-top:7px;font-size:12px;padding:6px 10px">J\'en ai un</button>') +
        "</div>" +
      "</article>"
    );
  }

  function filtrer() {
    var q = state.filtre.q.toLowerCase().trim();
    return state.objets.filter(function (o) {
      if (!estActif(o)) return false;
      if (state.filtre.mode === "gratuit" && o.mode !== "don" && o.mode !== "troc") return false;
      if (state.filtre.mode === "vente" && o.mode !== "vente") return false;
      if (state.filtre.mode === "recherche") return false;   // demandes seulement
      if (state.filtre.cat && o.cat !== state.filtre.cat) return false;
      if (state.filtre.niveau && o.niveau !== state.filtre.niveau) return false;
      if (q) {
        var foin = (o.titre + " " + (o.auteur || "") + " " + (o.isbn || "") + " " +
                    catNom(o.cat) + " " + (o.matiere || "")).toLowerCase();
        if (foin.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Un catalogue vide et un filtre trop étroit ne se soignent pas de la
  // même façon : dire « rien ne correspond à ces filtres » quand le
  // casier est simplement vide envoie chercher un bouton inexistant.
  function messageVide() {
    var actifs = state.objets.filter(estActif).length;
    if (actifs) {
      return '<div class="empty"><p>Rien ne correspond à ces filtres.</p>' +
        '<button class="btn ghost" data-act="reset">Tout afficher</button></div>';
    }
    return '<div class="empty">' +
      "<p><b>Le casier est vide pour l'instant.</b></p>" +
      '<p style="font-size:13px;max-width:38ch;margin:0 auto 14px">Déposez le premier objet — ' +
      "un manuel de l'an dernier, une calculatrice, des classeurs — et le service démarre.</p>" +
      '<button class="btn primary" data-act="aller-depot">Déposer le premier objet</button></div>';
  }

  function vueCatalogue() {
    // Don et troc sont regroupés : dans les deux cas l'élève ne sort pas
    // d'argent, et c'est la seule question qu'il se pose en parcourant.
    var modes = [["", "Tout"], ["gratuit", "Gratuit"], ["vente", "Ventes"],
                 ["recherche", "Recherchés"]];
    var seg = "";
    for (var m = 0; m < modes.length; m++) {
      seg += '<button data-mode="' + modes[m][0] + '" aria-pressed="' +
        (state.filtre.mode === modes[m][0]) + '">' + modes[m][1] + "</button>";
    }

    var chips = '<button class="chip" data-cat="" aria-pressed="' + (!state.filtre.cat) + '">Toutes catégories</button>';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      chips += '<button class="chip" data-cat="' + c.id + '" style="--sw:' + sw(c.id) + '" aria-pressed="' +
        (state.filtre.cat === c.id) + '"><span class="swatch"></span>' + c.nom + "</button>";
    }

    var opts = '<option value="">Tous niveaux</option>';
    for (var j = 0; j < NIVEAUX.length; j++) {
      opts += '<option value="' + NIVEAUX[j] + '"' + (state.filtre.niveau === NIVEAUX[j] ? " selected" : "") + ">" + NIVEAUX[j] + "</option>";
    }

    var res = filtrer();
    var dem = filtrerDemandes();
    var gratuits = res.filter(function (o) { return o.mode === "don" || o.mode === "troc"; }).length;
    var cartes = res.map(function (o) { return carte(o); })
                    .concat(dem.map(function (r) { return carteDemande(r); }));
    var corps = cartes.length
      ? '<div class="grid">' + cartes.join("") + "</div>"
      : messageVide();

    return (
      '<div class="filters">' +
        '<div class="search">' +
          '<input type="search" id="q" placeholder="Chercher un titre, une matière, un code-barres…" value="' + esc(state.filtre.q) + '" aria-label="Rechercher">' +
          '<select id="niv" aria-label="Filtrer par niveau" style="flex:0 0 160px;width:auto">' + opts + "</select>" +
        "</div>" +
        '<div class="seg" role="group" aria-label="Filtrer par type d\'échange">' + seg + "</div>" +
        '<div class="chiprail">' + chips + "</div>" +
      "</div>" +
      '<div class="count">' +
        '<span class="lbl"><b>' + res.length + "</b> annonce" + (res.length > 1 ? "s" : "") +
        (gratuits ? " · dont <b>" + gratuits + "</b> sans argent" : "") +
        (dem.length ? " · <b>" + dem.length + "</b> recherché" + (dem.length > 1 ? "s" : "") : "") +
        "</span>" +
        '<span class="lbl">Remise au CDI</span>' +
      "</div>" + corps
    );
  }

  // Chercher n'est pas déposer : ni photo, ni état, ni prix. Ne montrer

        "le voir réclamé le décide.</p>" +
        '<div class="modepick" style="margin-bottom:16px">' + pick + "</div>" +
        '<div class="form-grid">' +
          '<div class="full"><label for="r-titre">Ce que vous cherchez</label>' +
            '<input id="r-titre" required maxlength="90" placeholder="Manuel de SES Terminale"></div>' +
          '<div><label for="r-cat">Catégorie</label><select id="r-cat">' + cats + "</select></div>" +
          '<div><label for="r-mat">Matière</label><select id="r-mat">' + mats + "</select></div>" +
          '<div><label for="r-niv">Niveau</label><select id="r-niv">' + nivs + "</select></div>" +

        "</div>" +
        '<div class="form-foot">' +

          '<button class="btn primary" type="submit">Publier ma demande</button>' +
        "</div>" +
      "</form></div>"

  }

              '<span class="photo-etat" id="photo-etat">' +
                (state.photo
                  ? "Prête : vignette " + Math.round(state.photo.mini.size / 1024) +

  function vueMes() {
    if (!state.me) {
      return '<div class="panel"><h2>Aucun échange pour l\'instant</h2>' +
        '<p class="sub">Créez votre compte en haut de la page pour déposer et réserver.</p></div>';
    }
    var deposes = state.objets.filter(function (o) { return o.proprietaireCle === state.me.cle; });
    var pris = state.objets.filter(function (o) {
      return o.reserveParCle === state.me.cle && o.proprietaireCle !== state.me.cle;
    });

    var html = "";
    html += '<h2 class="section-title">À récupérer <span>' + pris.length + "</span></h2>";
    html += pris.length
      ? '<div class="grid">' + pris.map(function (o) { return carte(o); }).join("") + "</div>"
      : '<div class="empty"><p>Vous n\'avez réservé aucun objet.</p>' +
        '<button class="btn ghost" data-act="aller-catalogue">Parcourir le catalogue</button></div>';

    html += '<h2 class="section-title">Mes annonces <span>' + deposes.length + "</span></h2>";
    html += deposes.length
      ? '<div class="grid">' + deposes.map(function (o) { return carte(o); }).join("") + "</div>"
      : '<div class="empty"><p>Vous n\'avez encore rien déposé.</p>' +
        '<button class="btn ghost" data-act="aller-depot">Déposer une annonce</button></div>';

  }

  }

  function quand(iso) {
    var d = new Date(iso), maintenant = new Date();
    var meme = d.toDateString() === maintenant.toDateString();
    return meme
      ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  // Écran d'une conversation pas encore née : même apparence, mais rien
  // n'est enregistré tant que le premier message n'est pas envoyé.
  function vueNouvelleDiscussion() {
    var o = trouver(state.filEnAttente);
    if (!o) { state.filEnAttente = null; return vueMessages(); }
    return (
      '<div style="display:flex;align-items:center;gap:10px;padding:14px 0 10px">' +
        '<button class="btn ghost" data-act="retour-messages" style="flex:none">Retour</button>' +
        '<div style="min-width:0">' +
          '<b style="display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            esc(o.titre) + "</b>" +
          '<span style="font-size:12px;color:var(--faint)">avec ' + esc(o.proprietaire) +
            (o.classe ? " · " + esc(o.classe) : "") + "</span>" +
        "</div>" +
        '<button class="btn ghost" data-ouvrir="' + o.id + '" style="flex:none;margin-left:auto">Voir</button>' +
      "</div>" +
      '<p class="rappel-rdv">Convenez d\'un créneau et retrouvez-vous <b>au CDI</b>. ' +
      "Ne donnez ni adresse, ni numéro de téléphone : le rendez-vous se fixe ici.</p>" +
      '<div class="discussion" id="discussion">' +
        '<p class="empty" style="padding:26px 18px">Premier message : dites ce qui vous intéresse ' +
        "et proposez un créneau.</p>" +
      "</div>" +
      '<form class="saisie" id="f-message">' +
        '<textarea id="m-texte" rows="1" maxlength="800" placeholder="Votre message…" aria-label="Votre message"></textarea>' +
        '<button class="btn primary" type="submit">Envoyer</button>' +
      "</form>"
    );
  }

  function vueMessages() {
    if (!state.me) {
      return '<div class="panel"><h2>Vos discussions</h2>' +
        '<p class="sub">Créez votre compte pour écrire aux autres élèves et convenir d\'un rendez-vous.</p></div>';
    }

    if (state.filOuvert || state.filEnAttente) return vueDiscussion();
    // Un fil sans message n'a rien à montrer : reste des versions où il
    // était créé dès l'appui sur « Écrire ».
    var fils = state.fils.filter(function (f) { return !!f.dernierAuteur; });

    if (!fils.length) {
      return '<h2 class="section-title">Messages</h2>' +
        '<div class="empty"><p>Aucune discussion pour l\'instant.</p>' +
        "<p style=\"font-size:13px\">Ouvrez une annonce et touchez « Écrire » pour convenir d'un rendez-vous.</p>" +
        '<p style="font-size:12px;color:var(--faint)">Connectée en <b>' + esc(state.me.pseudo) +
        (state.me.classe ? " · " + esc(state.me.classe) : "") +
        "</b>. Les conversations d'un autre compte n'apparaissent pas ici.</p>" +
        '<button class="btn ghost" data-act="aller-catalogue">Parcourir le catalogue</button></div>';
    }

    var html = '<h2 class="section-title">Messages <span>' + fils.length + "</span></h2>";
    html += '<div class="fils">';
    for (var i = 0; i < fils.length; i++) {
      var f = fils[i];
      var o = trouver(f.objet) || {};
      var autre = (f.proprietaire === state.me.cle) ? f.demandeur : f.proprietaire;
      var m = state.membres[autre] || {};
      var neuf = aVoir(f);
      html +=
        '<button class="fil" data-fil="' + f.id + '" style="--sw:' + sw(o.cat) + '">' +
          '<span class="miniature">' +
            (o.photoMin || o.photo
              ? '<img src="' + esc(urlPhoto(o.photoMin || o.photo)) + '" alt="">'
              : "<span>" + esc((catNom(o.cat) || "?").slice(0, 3)) + "</span>") +
          "</span>" +
          '<span class="txt">' +
            "<b>" + esc(o.titre || "Annonce retirée") + "</b>" +
            '<span class="qui">' + esc(m.pseudo || "élève") +
              (m.classe ? " · " + esc(m.classe) : "") + "</span>" +
            '<span class="apercu">' + (f.apercu ? esc(f.apercu) : "Aucun message") + "</span>" +
          "</span>" +
          (neuf ? '<i class="pastille" style="position:static">1</i>' : "") +
        "</button>";
    }
    return html + "</div>";
  }

  function vueDiscussion() {
    if (!state.filOuvert && state.filEnAttente) return vueNouvelleDiscussion();
    var f = null;
    for (var i = 0; i < state.fils.length; i++) if (state.fils[i].id === state.filOuvert) f = state.fils[i];
    if (!f) { state.filOuvert = null; return vueMessages(); }

    var o = trouver(f.objet) || {};
    var autre = (f.proprietaire === state.me.cle) ? f.demandeur : f.proprietaire;
    var m = state.membres[autre] || {};

    var bulles = "";
    for (var k = 0; k < state.messages.length; k++) {
      var msg = state.messages[k];
      var moi = msg.auteur === state.me.cle;
      bulles += '<div class="bulle ' + (moi ? "moi" : "lui") + '">' + esc(msg.texte) +
                "<time>" + quand(msg.envoye_le) + "</time></div>";
    }
    if (!bulles) {
      bulles = '<p class="empty" style="padding:26px 18px">Premier message : proposez un créneau et un point de rendez-vous.</p>';
    }

    return (
      '<div style="display:flex;align-items:center;gap:10px;padding:14px 0 10px">' +
        '<button class="btn ghost" data-act="retour-messages" style="flex:none">Retour</button>' +
        '<div style="min-width:0">' +
          '<b style="display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            esc(o.titre || "Annonce retirée") + "</b>" +
          '<span style="font-size:12px;color:var(--faint)">avec ' + esc(m.pseudo || "élève") +
            (m.classe ? " · " + esc(m.classe) : "") + "</span>" +
        "</div>" +
        (o.id ? '<button class="btn ghost" data-ouvrir="' + o.id + '" style="flex:none;margin-left:auto">Voir</button>' : "") +
      "</div>" +
      '<p class="rappel-rdv">Convenez d\'un créneau et retrouvez-vous <b>au CDI</b>. ' +
      "Ne donnez ni adresse, ni numéro de téléphone : le rendez-vous se fixe ici.</p>" +
      '<div class="discussion" id="discussion">' + bulles + "</div>" +
      '<form class="saisie" id="f-message">' +
        '<textarea id="m-texte" rows="1" maxlength="800" placeholder="Proposez un créneau…" aria-label="Votre message"></textarea>' +
        '<button class="btn primary" type="submit">Envoyer</button>' +
      "</form>"
    );
  }

  function vueRecherches() {
    var mesRecherches = state.me
      ? state.recherches.filter(function (r) { return r.demandeur === state.me.cle; })
      : [];

    var html = '<div class="panel" style="margin:18px 0 0">' +
      "<h2>Vous cherchez quelque chose ?</h2>" +
      '<p class="sub">Le catalogue ne montre que ce que les élèves ont déjà déposé. ' +
      "Publiez votre demande : celui qui a ce manuel au fond d'un placard n'aurait jamais pensé à le sortir.</p>";

    if (!state.me) {
      html += '<p class="note" style="margin:0">Créez votre compte pour publier une demande.</p></div>';
    } else {
      var cats = '<option value="">Catégorie</option>';
      for (var i = 0; i < CATEGORIES.length; i++) cats += '<option value="' + CATEGORIES[i].id + '">' + CATEGORIES[i].nom + "</option>";
      var mats = '<option value="">Matière</option>';
      for (var j = 0; j < MATIERES.length; j++) mats += '<option value="' + MATIERES[j] + '">' + MATIERES[j] + "</option>";
      var nivs = '<option value="">Niveau</option>';
      for (var k = 0; k < NIVEAUX.length; k++) nivs += '<option value="' + NIVEAUX[k] + '">' + NIVEAUX[k] + "</option>";
      html +=
        '<form id="f-recherche"><div class="form-grid">' +
          '<div class="full"><label for="r-titre">Ce que vous cherchez</label>' +
            '<input id="r-titre" required maxlength="90" placeholder="Manuel de SES Terminale"></div>' +
          '<div><label for="r-cat">Catégorie</label><select id="r-cat">' + cats + "</select></div>" +
          '<div><label for="r-mat">Matière</label><select id="r-mat">' + mats + "</select></div>" +
          '<div><label for="r-niv">Niveau</label><select id="r-niv">' + nivs + "</select></div>" +
          '<div class="full"><label for="r-note">Précisions <span class="opt">(facultatif)</span></label>' +
            '<input id="r-note" maxlength="200" placeholder="Édition 2022 de préférence, peu importe l\'état."></div>' +
        "</div>" +
        '<div class="form-foot"><p>Votre demande reste visible tant que vous ne la retirez pas.</p>' +
        '<button class="btn primary" type="submit">Publier ma demande</button></div></form></div>';
    }

    html += '<h2 class="section-title">Recherchés par le lycée <span>' + state.recherches.length + "</span></h2>";
    if (!state.recherches.length) {
      html += '<div class="empty"><p>Aucune demande pour l\'instant.</p></div>';
      return html;
    }

    html += '<div class="fils">';
    for (var n = 0; n < state.recherches.length; n++) {
      var r = state.recherches[n];
      var dem = state.membres[r.demandeur] || {};
      var mien = state.me && r.demandeur === state.me.cle;
      html +=
        '<div class="fil" style="--sw:' + sw(r.categorie || "autre") + ';cursor:default">' +
          '<span class="miniature"><span>' + esc((catNom(r.categorie) || "?").slice(0, 3)) + "</span></span>" +
          '<span class="txt">' +
            "<b>" + esc(r.titre) + "</b>" +
            '<span class="qui">' + esc(dem.pseudo || "élève") +
              (dem.classe ? " · " + esc(dem.classe) : "") + (mien ? " · vous" : "") + "</span>" +
            '<span class="apercu">' +
              [r.matiere, r.niveau, r.note].filter(Boolean).map(esc).join(" · ") +
            "</span>" +
          "</span>" +
          (mien
            ? '<button class="btn icon" data-retirer-recherche="' + r.id + '" title="Retirer" aria-label="Retirer ma demande">✕</button>'
            : '<button class="btn ghost" data-act="aller-depot" style="flex:none">J\'en ai un</button>') +
        "</div>";
    }
    return html + "</div>";
  }

  var MOTIF_NOM = {
    inapproprie: "contenu déplacé", interdit: "objet interdit",
    prix: "prix abusif", faux: "annonce trompeuse", autre: "autre raison"
  };

  function vueModeration() {
    if (!state.referent) {
      return '<div class="panel" style="margin:18px 0 0"><h2>Modération</h2>' +
        '<p class="sub">Cette page est réservée à l\'adulte référent du casier.</p></div>';
    }
    var att = [], vus = [];
    for (var i = 0; i < state.file.length; i++) {
      (state.file[i].moderation === "masque" ? att : vus).push(state.file[i]);
    }

    var html = '<div class="panel" style="margin:18px 0 0">' +
      "<h2>Modération</h2>" +
      '<p class="sub">Une annonce signalée est masquée aussitôt, puis attend votre décision. ' +
      "La rétablir la rend visible pour de bon : elle ne pourra plus être masquée " +
      "par un nouveau signalement, ce qui empêche un élève de recommencer indéfiniment.</p></div>";

    html += '<h2 class="section-title">À vérifier <span>' + att.length + "</span></h2>";
    html += att.length
      ? att.map(carteModeration).join("")
      : '<div class="panel"><p class="sub">Rien en attente. Le casier est calme.</p></div>';

    if (vus.length) {
      html += '<h2 class="section-title">Déjà tranchées <span>' + vus.length + "</span></h2>";
      html += vus.map(carteModeration).join("");
    }

    html += '<h2 class="section-title">Fiches d\'articles <span>' +
            state.fichesRef.length + "</span></h2>";
    html += '<div class="panel">' +
      '<p class="sub">Ce qu\'un élève a saisi la première fois qu\'un code-barres a été ' +
      "scanné. Les élèves suivants complètent les champs vides mais ne peuvent plus " +
      "réécrire le titre — c'est donc à vous de corriger. Supprimer une fiche ne touche " +
      "à aucune annonce : le prochain dépôt la recrée.</p>" +
      (state.fichesRef.length
        ? '<ul class="fiches-ref">' + state.fichesRef.map(ligneFiche).join("") + "</ul>"
        : '<p class="note" style="margin:11px 0 0">Aucune fiche pour l\'instant.</p>') +
      "</div>";
    return html;
  }

  function ligneFiche(f) {
    var d = new Date(f.maj);
    var quand = isNaN(d) ? "" : d.toLocaleDateString("fr-FR",
                  { day: "numeric", month: "short" });
    var n = Number(f.saisies) || 1;
    return "<li>" +
      "<div><b>" + esc(f.titre) + "</b>" +
        '<span class="fiche-meta">' + esc(f.code) +
        (f.categorie ? " · " + esc(catNom(f.categorie)) : "") +
        " · " + n + (n > 1 ? " dépôts" : " dépôt") +
        (quand ? " · " + esc(quand) : "") + "</span></div>" +
      '<button class="btn ghost" data-act="supprimer-fiche" data-code="' +
        esc(f.code) + '">Supprimer</button>' +
      "</li>";
  }

  function carteModeration(f) {
    // Plusieurs élèves peuvent signaler pour la même raison : on compte
    // plutôt que de répéter la ligne.
    var compte = {}, ordre = [];
    (f.motifs || []).forEach(function (m) {
      if (!compte[m]) { compte[m] = 0; ordre.push(m); }
      compte[m]++;
    });
    var liste = ordre.map(function (m) {
      return esc(MOTIF_NOM[m] || m) + (compte[m] > 1 ? " ×" + compte[m] : "");
    }).join(", ");

    var prec = (f.precisions || []).map(function (x) {
      return "<li>" + esc(x) + "</li>";
    }).join("");

    var valeur = f.mode === "vente" ? prixFmt(Number(f.prix) || 0)
               : f.mode === "don"   ? "don" : "troc";
    var nb = Number(f.nb) || 0;
    var enAttente = f.moderation === "masque";

    return '<div class="panel moderation">' +
      '<div class="mod-tete">' +
        (f.photo
          ? '<img class="mod-photo" src="' + esc(urlPhoto(f.photo)) +
            '" alt="" onerror="this.remove()">'
          : "") +
        "<div><h3>" + esc(f.titre) + "</h3>" +
        '<p class="sub">' + esc(f.proprietaire) +
          (f.classe ? " · " + esc(f.classe) : "") +
          " · " + esc(catNom(f.categorie)) + " · " + esc(valeur) +
          (f.statut === "reserve" ? " · réservé" : "") + "</p></div>" +
      "</div>" +
      (f.note ? '<p class="note">' + esc(f.note) + "</p>" : "") +
      '<p class="mod-motifs"><b>' + nb + " signalement" + (nb > 1 ? "s" : "") +
        "</b> — " + liste + "</p>" +
      (prec ? '<ul class="mod-prec">' + prec + "</ul>" : "") +
      (enAttente
        ? '<div class="fiche-actions">' +
            '<button class="btn primary" data-act="moderer" data-id="' + f.objet +
              '" data-decision="retablir">Rétablir l\'annonce</button>' +
            '<button class="btn ghost" data-act="moderer" data-id="' + f.objet +
              '" data-decision="retirer">Supprimer l\'annonce</button>' +
          "</div>"
        : '<p class="note" style="margin:0">Rétablie. Elle reste visible même si elle est de nouveau signalée.</p>') +
      "</div>";
  }

  function blocNotifications() {
    // Recalculé à chaque rendu : l'autorisation peut être accordée ou
    // retirée depuis les réglages du navigateur, et la PWA installée
    // entre-temps — rien de tout cela ne prévient l'application.
    var e = etatPush();
    state.push.possible = e.possible;
    state.push.etat = e.etat;
    var p = state.push;

    if (p.etat === "ios-non-installee") {
      return '<div class="reglage"><div><b>Être prévenue des réponses</b>' +
        "<p>Sur iPhone, les notifications ne fonctionnent qu'une fois l'application " +
        "installée sur l'écran d'accueil : bouton <b>Partager</b> dans Safari, " +
        "puis <b>Sur l'écran d'accueil</b>. Revenez ici ensuite.</p></div></div>";
    }
    if (p.etat === "navigateur") {
      return '<div class="reglage"><div><b>Être prévenue des réponses</b>' +
        "<p>Ce navigateur ne sait pas recevoir de notifications.</p></div></div>";
    }
    if (p.etat === "refuse") {
      return '<div class="reglage"><div><b>Être prévenue des réponses</b>' +
        "<p>Vous avez refusé les notifications pour ce site. Il faut les réautoriser " +
        "dans les réglages du navigateur — l'application ne peut plus le demander.</p></div></div>";
    }

    return '<div class="reglage"><div><b>Être prévenue des réponses</b>' +
      "<p>" + (p.actif
        ? "Cet appareil vous préviendra quand un élève répondra à un message."
        : "Sans cela, il faut rouvrir l'application pour savoir si quelqu'un a répondu.") +
      "</p></div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        (p.actif ? '<button class="btn ghost" data-act="push-essai">Tester</button>' : "") +
        '<button class="btn ' + (p.actif ? "ghost" : "primary") + '" data-act="' +
          (p.actif ? "push-off" : "push-on") + '">' +
          (p.actif ? "Désactiver" : "Activer") + "</button>" +
      "</div></div>";
  }

  function vueMoi() {
    if (!state.me) {
      return '<div class="panel"><h2>Votre compte</h2>' +
        '<p class="sub">Créez votre compte en haut de la page pour déposer, réserver et discuter.</p></div>';
    }
    var m = moiMembre() || { credits: 0, dons: 0 };
    var deposes = state.objets.filter(function (o) { return o.proprietaireCle === state.me.cle; });
    var pris = state.objets.filter(function (o) {
      return o.reserveParCle === state.me.cle && o.proprietaireCle !== state.me.cle;
    });

    var html = '<div class="panel" style="margin:18px 0 0">' +
      "<h2>" + esc(state.me.pseudo) + "</h2>" +
      '<p class="sub">' + esc(state.me.classe || "classe non renseignée") +
      (state.compte && state.compte.email ? " · " + esc(state.compte.email) : "") + "</p>" +
      '<div class="circuits">' +
        '<div class="circuit" style="--sw:var(--accent)"><b>' + (m.credits || 0) + "</b>" +
          "<p>crédits, pour les échanges</p></div>" +
        '<div class="circuit" style="--sw:var(--ok)"><b>' + (m.dons || 0) + "</b>" +
          "<p>objets donnés</p></div>" +
      "</div>" +
      blocNotifications() +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        (estConnecte() ? '<button class="btn ghost" data-act="deconnexion">Se déconnecter</button>' : "") +
        '<button type="button" class="deconnexion" data-act="reinitialiser">Remettre l\'application à zéro</button>' +
      "</div>" +
      '<p style="margin:11px 0 0;font-size:12px;color:var(--faint)">La remise à zéro efface seulement ce que cet appareil garde en mémoire. ' +
      "Vos annonces et vos messages sont sur le serveur, ils ne bougent pas.</p>" +
      "</div>";

    html += '<h2 class="section-title">À récupérer <span>' + pris.length + "</span></h2>";
    html += pris.length
      ? '<div class="grid">' + pris.map(carte).join("") + "</div>"
      : '<div class="empty"><p>Vous n\'avez réservé aucun objet.</p></div>';

    html += '<h2 class="section-title">Mes annonces <span>' + deposes.length + "</span></h2>";
    html += deposes.length
      ? '<div class="grid">' + deposes.map(carte).join("") + "</div>"
      : '<div class="empty"><p>Vous n\'avez encore rien déposé.</p>' +
        '<button class="btn ghost" data-act="aller-depot">Déposer une annonce</button></div>';
    return html;
  }

  function render() {
    renderBalance();
    renderOnboard();
    renderNav();
    var v = document.getElementById("view");
    if (state.onglet === "catalogue")       v.innerHTML = vueCatalogue();
    else if (state.onglet === "recherches") { state.onglet = "catalogue"; v.innerHTML = vueCatalogue(); }
    else if (state.onglet === "deposer")    v.innerHTML = vueDeposer();
    else if (state.onglet === "messages")   v.innerHTML = vueMessages();
    else if (state.onglet === "moderation") v.innerHTML = vueModeration();
    else                                    v.innerHTML = vueMoi();

    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function () { state.filtre.q = q.value; rerenderCatalogue(); });
    var niv = document.getElementById("niv");
    if (niv) niv.addEventListener("change", function () { state.filtre.niveau = niv.value; render(); });
    var fd = document.getElementById("f-depot");
    if (fd) {
      restituerBrouillon();
      // La page a pu être déchargée pendant la prise de vue : on récupère
      // ce qui avait été préparé avant de disparaître.
      if (!state.photo) {
        reprendrePhoto().then(function (images) {
          if (images && images.mini && !state.photo) {
            state.photo = images;
            render();
            toast("Votre photo a été retrouvée.");
          }
        });
      }
      majPublier();
      majSuggestions();
      fd.addEventListener("submit", onDepot);
      fd.addEventListener("input", function () { retenirBrouillon(); majPublier(); });
      fd.addEventListener("change", function () {
        retenirBrouillon(); majPublier(); majSuggestions();
      });
    }

    var fp = document.getElementById("d-photo");
    if (fp) fp.addEventListener("change", onPhotoChoisie);

    // Le scan n'est pas toujours possible : une saisie manuelle correcte
    // déclenche la même recherche, sans bouton supplémentaire.
    var fm = document.getElementById("f-message");
    if (fm) {
      var zone = document.getElementById("m-texte");
      fm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var t = zone.value; zone.value = ""; zone.style.height = "";
        envoyer(t);
      });
      // La zone grandit avec le message, comme dans une messagerie.
      zone.addEventListener("input", function () {
        zone.style.height = "auto";
        zone.style.height = Math.min(zone.scrollHeight, 120) + "px";
      });
      glisserEnBas();
    }

    var fr = document.getElementById("f-recherche");
    if (fr) fr.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!state.me) { toast("Créez votre compte pour publier une demande."); return; }
      var t = document.getElementById("r-titre").value.trim();
      if (!t) return;
      publierRecherche({
        titre: t,
        cat: document.getElementById("r-cat").value,
        matiere: document.getElementById("r-mat").value,
        niveau: document.getElementById("r-niv").value,
        note: document.getElementById("r-note").value.trim()
      });
      fr.reset();
      state.onglet = "catalogue";
    });

    var fi = document.getElementById("d-isbn");
    if (fi) fi.addEventListener("input", function () {
      var n = normaliserIsbn(fi.value);
      if (n && n !== state.dernierIsbn) { state.dernierIsbn = n; remplirDepuisIsbn(n); }
    });
    if (state.photo) apercuPhoto();

    renderStatus();
    poserPastille();
    if (state.fiche) renderFiche();
  }

  // Re-rend la grille seule, pour ne pas perdre le focus du champ de recherche à chaque frappe.
  function rerenderCatalogue() {
    if (state.onglet !== "catalogue") return;
    var res = filtrer();
    var gratuits = res.filter(function (o) { return o.mode === "don"; }).length;
    var v = document.getElementById("view");
    var cible = v.querySelector(".grid") || v.querySelector(".empty");
    var lbl = v.querySelector(".count .lbl");
    if (lbl) {
      lbl.innerHTML = "<b>" + res.length + "</b> annonce" + (res.length > 1 ? "s" : "") +
        (gratuits ? " · dont <b>" + gratuits + "</b> gratuite" + (gratuits > 1 ? "s" : "") : "");
    }
    var neuf = res.length
      ? '<div class="grid">' + res.map(function (o) { return carte(o); }).join("") + "</div>"
      : messageVide();
    if (cible) cible.outerHTML = neuf;
  }

  function renderStatus() {
    var el = document.getElementById("status");
    if (state.horsLigne) {
      el.innerHTML = "<b>Hors ligne</b> · " + esc(state.horsLigne) +
        " — les annonces affichées sont des exemples.";
    } else if (state.pret) {
      el.innerHTML = "<b>" + state.objets.length + "</b> annonces · <b>" +
        state.recherches.length + "</b> demandes · mis à jour en direct pour tout le lycée." +
        '<br><span style="opacity:.6">version ' + VERSION_APP + "</span>";
    } else {
      el.textContent = "Connexion au catalogue…";
    }
  }

  function apercuPhoto() {
    var box = document.getElementById("photo-apercu");
    if (!box || !state.photo) return;
    var url = URL.createObjectURL(state.photo.mini);
    box.innerHTML = '<img src="' + url + '" alt="Aperçu de la photo">';
    box.hidden = false;
    box.firstChild.onload = function () { URL.revokeObjectURL(url); };
  }

  function onPhotoChoisie(ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast("Ce fichier n'est pas une image."); return; }

    var etat = document.getElementById("photo-etat");
    if (etat) etat.textContent = "Compression…";

    retenirBrouillon();
    preparerImages(f).then(function (images) {
      state.photo = images;
      rangerPhoto(images);
      render();
      toast("Photo prête : " + Math.round(f.size / 1024) + " ko réduits à " +
            Math.round(images.mini.size / 1024) + " ko pour le catalogue.");
    }).catch(function () {
      state.photo = null;
      render();
      toast("Cette image n'a pas pu être lue. Réessayez.");
    });
  }

  var CHAMPS_DEPOT = ["d-titre", "d-auteur", "d-isbn", "d-cat", "d-mat",
                      "d-niv", "d-etat", "d-note", "d-prix"];

  // Choisir une photo ou changer de mode redessine le formulaire, ce qui
  // effaçait tout ce que l'élève avait déjà tapé. On garde la saisie de
  // côté et on la remet en place après le rendu.
  function retenirBrouillon() {
    if (!document.getElementById("f-depot")) return;
    CHAMPS_DEPOT.forEach(function (id) {
      var e = document.getElementById(id);
      if (e) state.brouillon[id] = e.value;
    });
    // Même raison que la photo : un déchargement de page ne doit pas
    // effacer ce que l'élève vient de saisir.
    try { sessionStorage.setItem("casier-brouillon", JSON.stringify(state.brouillon)); } catch (e) {}
  }

  function restituerBrouillon() {
    if (!Object.keys(state.brouillon).length) {
      try {
        var garde = JSON.parse(sessionStorage.getItem("casier-brouillon") || "null");
        if (garde) state.brouillon = garde;
      } catch (e) {}
    }
    CHAMPS_DEPOT.forEach(function (id) {
      var e = document.getElementById(id);
      if (e && state.brouillon[id] !== undefined && state.brouillon[id] !== "") {
        e.value = state.brouillon[id];
      }
    });
  }

  // Publier une vente sans prix n'a pas de sens, et la base la refuse de
  // toute façon. Autant éteindre le bouton tout de suite plutôt que de
  // laisser l'élève remplir tout le formulaire pour buter sur un refus.
  // Le don et le troc n'ont pas de champ prix : rien ne les retient.
  function blocSuggestions(cat) {
    // Pour un livre, le code-barres fait mieux que n'importe quelle
    // liste : on le rappelle plutôt que de laisser un vide.
    if (cat === "manuel" || cat === "lecture") {
      return '<p class="aide-scan" style="margin:0">Pour un livre, le code-barres au dos remplit ' +
             "tout seul le titre, l'auteur et l'éditeur. Inutile de saisir quoi que ce soit.</p>";
    }
    var liste = SUGGESTIONS[cat];
    if (!liste || !liste.length) return "";

    var h = '<label>Les plus courants <span class="opt">(un clic remplit les champs)</span></label>' +
            '<div class="chiprail">';
    for (var i = 0; i < liste.length; i++) {
      var cle = cat + "|" + i;
      h += '<button type="button" class="chip" data-sugg="' + cle + '" aria-pressed="' +
